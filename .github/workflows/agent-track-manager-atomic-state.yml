name: Apply atomic TrackManager state replacement fix

on:
  push:
    branches:
      - agent/fix-track-manager-atomic-state

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-track-manager-atomic-state

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply source and regression patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/pyrecest/filters/track_manager.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''    @filter_state.setter
              def filter_state(self, new_state):
                  self.tracks = []
                  self._next_track_id = 0
                  for filter_or_state in new_state:
                      self.add_track(
                          filter_or_state,
                          step=self._current_step,
                          status=TrackStatus.CONFIRMED,
                      )
                  if self.log_prior_estimates:
                      self.store_prior_estimates()
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '''    @filter_state.setter
              def filter_state(self, new_state):
                  replacement_filters = [
                      self._normalize_filter(filter_or_state)
                      for filter_or_state in new_state
                  ]

                  self.tracks = []
                  self._next_track_id = 0
                  for single_target_filter in replacement_filters:
                      self.add_track(
                          single_target_filter,
                          step=self._current_step,
                          status=TrackStatus.CONFIRMED,
                      )
                  if self.log_prior_estimates:
                      self.store_prior_estimates()
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one TrackManager.filter_state setter")
          source_path.write_text(source.replace(old, new), encoding="utf-8")

          test_path = Path("tests/filters/test_track_manager_atomic_filter_state.py")
          test_path.write_text(
              '''import unittest

          import numpy as np
          from pyrecest.filters.track_manager import TrackManager


          class TrackManagerAtomicFilterStateTest(unittest.TestCase):
              @staticmethod
              def _state(mean):
                  return np.array([mean], dtype=float), np.array([[1.0]], dtype=float)

              def test_invalid_replacement_preserves_existing_track_bank(self):
                  manager = TrackManager(
                      keep_history=False,
                      log_prior_estimates=False,
                      log_posterior_estimates=False,
                  )
                  manager.filter_state = [self._state(1.0)]
                  original_tracks = manager.tracks
                  original_track = manager.tracks[0]
                  original_next_track_id = manager._next_track_id

                  with self.assertRaisesRegex(ValueError, "Expected an AbstractFilter"):
                      manager.filter_state = [self._state(2.0), object()]

                  self.assertIs(manager.tracks, original_tracks)
                  self.assertIs(manager.tracks[0], original_track)
                  self.assertEqual(manager._next_track_id, original_next_track_id)
                  np.testing.assert_allclose(
                      manager.tracks[0].get_point_estimate(),
                      np.array([1.0]),
                  )
          '''.replace('          ', ''),
              encoding="utf-8",
          )

          Path(".github/workflows/agent-track-manager-atomic-state.yml").unlink()
          PY

      - name: Install targeted test dependencies
        run: python -m pip install -e . pytest

      - name: Run TrackManager regression tests
        run: python -m pytest tests/filters/test_track_manager_atomic_filter_state.py tests/filters/test_track_manager.py -q

      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pyrecest/filters/track_manager.py tests/filters/test_track_manager_atomic_filter_state.py .github/workflows/agent-track-manager-atomic-state.yml
          git commit -m "Make TrackManager state replacement atomic"
          git push origin HEAD:agent/fix-track-manager-atomic-state
