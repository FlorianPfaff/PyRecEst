name: Apply stable SO(3) product normalization

on:
  push:
    branches:
      - agent/stabilize-so3-product-quaternion-normalization

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch product quaternion normalization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source_path = Path("src/pyrecest/distributions/so3_product_dirac_distribution.py")
          source = source_path.read_text(encoding="utf-8")

          import_anchor = """    where,
          )

          from .cart_prod.hyperhemisphere_cart_prod_dirac_distribution import (
          """
          import_replacement = """    where,
          )

          from ._so3_helpers import normalize_quaternions as _normalize_so3_quaternions
          from .cart_prod.hyperhemisphere_cart_prod_dirac_distribution import (
          """
          if source.count(import_anchor) != 1:
              raise RuntimeError("unexpected SO(3) helper import anchor count")
          source = source.replace(import_anchor, import_replacement, 1)

          old_method = """    @staticmethod
              def _normalize_quaternions(quaternions):
                  norms = linalg.norm(quaternions, axis=-1)
                  if not all(isfinite(quaternions)):
                      raise ValueError("SO(3) quaternions must be finite.")
                  if not all(isfinite(norms)):
                      raise ValueError("SO(3) quaternion norms must be finite.")
                  if not all(norms > 0.0):
                      raise ValueError("SO(3) quaternions must be nonzero.")
                  return quaternions / reshape(norms, tuple(norms.shape) + (1,))
          """
          new_method = """    @staticmethod
              def _normalize_quaternions(quaternions):
                  normalized = _normalize_so3_quaternions(quaternions)
                  return reshape(normalized, tuple(quaternions.shape))
          """
          if source.count(old_method) != 1:
              raise RuntimeError("unexpected quaternion normalization anchor count")
          source = source.replace(old_method, new_method, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path(
              "tests/distributions/test_so3_product_dirac_extreme_norms.py"
          )
          test_path.write_text(
              dedent(
                  '''\
                  """Regression tests for stable SO(3) product quaternion normalization."""

                  import numpy as np
                  import numpy.testing as npt

                  from pyrecest.backend import array, to_numpy
                  from pyrecest.distributions import SO3ProductDiracDistribution


                  def test_product_distribution_normalizes_extreme_finite_scales():
                      backend_dtype = to_numpy(array([1.0])).dtype
                      finfo = np.finfo(backend_dtype)
                      locations = array(
                          np.asarray(
                              [
                                  [[finfo.max, finfo.max / 2.0, 0.0, 0.0]],
                                  [[2.0 * finfo.tiny, finfo.tiny, 0.0, 0.0]],
                              ],
                              dtype=backend_dtype,
                          )
                      )
                      expected_direction = np.asarray(
                          [2.0 / np.sqrt(5.0), 1.0 / np.sqrt(5.0), 0.0, 0.0],
                          dtype=backend_dtype,
                      )

                      distribution = SO3ProductDiracDistribution(locations)
                      normalized = to_numpy(distribution.d[:, 0, :])

                      assert np.all(np.isfinite(normalized))
                      npt.assert_allclose(
                          normalized,
                          np.stack([expected_direction, expected_direction]),
                          rtol=1.0e-6,
                          atol=1.0e-7,
                      )


                  def test_geodesic_distance_preserves_scalar_shape_for_single_rotations():
                      rotation = array([0.0, 0.0, 0.0, 1.0])

                      distance = SO3ProductDiracDistribution.geodesic_distance(
                          rotation, rotation
                      )

                      assert tuple(distance.shape) == ()
                      assert float(distance) == 0.0
                  '''
              ),
              encoding="utf-8",
          )
          PY

      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest

      - name: Run focused regressions
        run: |
          python -m pytest \
            tests/distributions/test_so3_quaternion_extreme_scales.py \
            tests/distributions/test_so3_product_dirac_distribution.py \
            tests/distributions/test_so3_product_dirac_extreme_norms.py \
            -q

      - name: Check syntax and whitespace
        run: |
          python -m compileall -q \
            src/pyrecest/distributions/so3_product_dirac_distribution.py \
            tests/distributions/test_so3_product_dirac_extreme_norms.py
          git diff --check

      - name: Commit final patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-so3-product-quaternion-normalization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pyrecest/distributions/so3_product_dirac_distribution.py \
            tests/distributions/test_so3_product_dirac_extreme_norms.py \
            .github/workflows/apply-so3-product-quaternion-normalization.yml
          git commit -m "Reuse stable SO(3) quaternion normalization"
          git push origin HEAD:${{ github.ref_name }}
