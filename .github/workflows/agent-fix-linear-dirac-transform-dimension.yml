name: Apply Linear Dirac transform-dimension fix

on:
  push:
    branches:
      - agent/fix-linear-dirac-transform-dimension

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply focused patch and regression
        shell: python
        run: |
          from pathlib import Path

          source_path = Path("src/pyrecest/distributions/nonperiodic/linear_dirac_distribution.py")
          source = source_path.read_text(encoding="utf-8")
          marker = "    def set_mean(self, new_mean):\n"
          method = '''    def apply_function(self, f, function_is_vectorized=True):
              """Apply a transform and rebuild dimension-dependent linear metadata."""
              transformed = super().apply_function(
                  f, function_is_vectorized=function_is_vectorized
              )
              return LinearDiracDistribution(transformed.d, transformed.w)

          '''
          if method not in source:
              if marker not in source:
                  raise RuntimeError("LinearDiracDistribution insertion point not found")
              source = source.replace(marker, method + marker, 1)
              source_path.write_text(source, encoding="utf-8")

          test_path = Path(
              "tests/distributions/test_linear_dirac_apply_function_dimension.py"
          )
          test_path.write_text(
              '''import numpy.testing as npt

          from pyrecest.backend import array
          from pyrecest.distributions import LinearDiracDistribution


          def test_apply_function_rebuilds_dimension_after_shape_change():
              dist = LinearDiracDistribution(
                  array([[0.0, 1.0], [2.0, 3.0]]),
                  array([0.25, 0.75]),
              )

              mapped = dist.apply_function(lambda particles: particles[:, :1])

              assert dist.dim == 2
              assert mapped.dim == 1
              assert tuple(mapped.d.shape) == (2, 1)
              assert tuple(mapped.mean().shape) == (1,)
              assert tuple(mapped.covariance().shape) == (1, 1)
              npt.assert_allclose(mapped.d, array([[0.0], [2.0]]))
              npt.assert_allclose(mapped.w, dist.w)
          ''',
              encoding="utf-8",
          )

          Path(
              ".github/workflows/agent-fix-linear-dirac-transform-dimension.yml"
          ).unlink()

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-min.txt pytest

      - name: Validate patch
        env:
          PYTHONPATH: src
          MPLBACKEND: Agg
        run: |
          python -m py_compile \
            src/pyrecest/distributions/nonperiodic/linear_dirac_distribution.py \
            tests/distributions/test_linear_dirac_apply_function_dimension.py
          python -m pytest -q \
            tests/distributions/test_linear_dirac_apply_function_dimension.py
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pyrecest/distributions/nonperiodic/linear_dirac_distribution.py \
            tests/distributions/test_linear_dirac_apply_function_dimension.py \
            .github/workflows/agent-fix-linear-dirac-transform-dimension.yml
          git commit -m "Fix Linear Dirac transform dimensions"
          git push
