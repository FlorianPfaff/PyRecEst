name: Repair main numerical tolerance edit

"on":
  push:
    branches:
      - agent/fix-main-numerical-test-tolerances-20260811

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-main-numerical-test-tolerances-20260811
          fetch-depth: 0

      - name: Repair focused assertion edit
        run: |
          python - <<'PY'
          from pathlib import Path

          reweight_path = Path(
              "tests/distributions/test_hypercylindrical_dirac_distribution.py"
          )
          reweight_text = reweight_path.read_text()
          malformed = (
              "        npt.assert_allclose(\n"
              "    pwd_rew3.w,\n"
              "    w_new / sum(w_new),\n"
              "    rtol=1e-15,\n"
              "    atol=0.0,\n"
              ")\n"
          )
          corrected = (
              "        npt.assert_allclose(pwd_rew3.w, w_new / sum(w_new), "
              "rtol=1e-15, atol=0.0)\n"
          )
          if reweight_text.count(malformed) != 1:
              raise RuntimeError("unexpected malformed reweight assertion layout")
          reweight_path.write_text(reweight_text.replace(malformed, corrected))

          so3_path = Path("tests/distributions/test_so3_product_dirac_distribution.py")
          so3_text = so3_path.read_text()
          expected_so3 = (
              "        npt.assert_allclose(component_distances[0], "
              "array([0.0, 0.0]), atol=1e-7)\n"
          )
          if so3_text.count(expected_so3) != 1:
              raise RuntimeError("SO(3) tolerance edit is not present exactly once")
          PY

      - name: Commit corrected changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/distributions/test_hypercylindrical_dirac_distribution.py
          git commit -m "test: correct numerical tolerance assertion formatting"
          git push origin HEAD:agent/fix-main-numerical-test-tolerances-20260811
