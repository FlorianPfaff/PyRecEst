name: One-shot ellipse symmetrization patch

on:
  push:
    branches:
      - agent/stabilize-ellipse-symmetrization

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/stabilize-ellipse-symmetrization

      - name: Apply fix and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/pyrecest/tracking/ellipse_geometry.py")
          source = source_path.read_text(encoding="utf-8")
          old = "    return 0.5 * (matrix + matrix.T)\n"
          new = "    return 0.5 * matrix + 0.5 * matrix.T\n"
          if source.count(old) != 1:
              raise SystemExit("expected exactly one ellipse symmetrization expression")
          source_path.write_text(source.replace(old, new), encoding="utf-8")

          test_path = Path(
              "tests/tracking/test_ellipse_geometry_extreme_symmetrization.py"
          )
          test_path.write_text(
              '''from __future__ import annotations

import numpy as np
import numpy.testing as npt
from pyrecest.tracking.ellipse_geometry import (
    project_symmetric_covariance,
    symmetrize,
)


def test_symmetrize_preserves_extreme_finite_diagonal() -> None:
    covariance = np.diag([1.0e308, 2.0e307])

    with np.errstate(over="raise", invalid="raise"):
        symmetric = np.asarray(symmetrize(covariance))

    assert np.all(np.isfinite(symmetric))
    npt.assert_array_equal(symmetric, covariance)


def test_covariance_projection_preserves_extreme_finite_diagonal() -> None:
    covariance = np.diag([1.0e308, 2.0e307])

    with np.errstate(over="raise", invalid="raise"):
        projected = np.asarray(project_symmetric_covariance(covariance))

    assert np.all(np.isfinite(projected))
    npt.assert_array_equal(projected, covariance)
''',
              encoding="utf-8",
          )

          Path(
              ".github/workflows/agent-stabilize-ellipse-symmetrization.yml"
          ).unlink()
          PY

      - name: Validate patch sources
        shell: bash
        run: |
          python -m py_compile \
            src/pyrecest/tracking/ellipse_geometry.py \
            tests/tracking/test_ellipse_geometry_extreme_symmetrization.py
          python - <<'PY'
          import numpy as np

          matrix = np.diag([1.0e308, 2.0e307])
          with np.errstate(over="raise", invalid="raise"):
              result = 0.5 * matrix + 0.5 * matrix.T
          np.testing.assert_array_equal(result, matrix)
          assert np.all(np.isfinite(result))
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pyrecest/tracking/ellipse_geometry.py \
            tests/tracking/test_ellipse_geometry_extreme_symmetrization.py \
            .github/workflows/agent-stabilize-ellipse-symmetrization.yml
          git commit -m "Stabilize ellipse covariance symmetrization"
          git push origin HEAD:agent/stabilize-ellipse-symmetrization
