name: Apply support-point direction normalization fix

on:
  push:
    branches:
      - agent/fix-support-direction-overflow-20260805
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: support-direction-overflow-patch
  cancel-in-progress: true

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fix-support-direction-overflow-20260805

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply regression fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/pyrecest/sampling/support_points.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''    if normalize_directions:
              norms = np.linalg.norm(directions_array, axis=1, keepdims=True)
              if bool(np.any(norms <= 0.0)):
                  raise ValueError(
                      "directions must be non-zero when normalize_directions=True."
                  )
              directions_array = directions_array / norms
          '''
          new = '''    if normalize_directions:
              direction_scales = np.max(np.abs(directions_array), axis=1, keepdims=True)
              if bool(np.any(direction_scales <= 0.0)):
                  raise ValueError(
                      "directions must be non-zero when normalize_directions=True."
                  )
              scaled_directions = directions_array / direction_scales
              norms = np.linalg.norm(scaled_directions, axis=1, keepdims=True)
              directions_array = scaled_directions / norms
          '''
          if source.count(old) != 1:
              raise RuntimeError("Expected exactly one direction-normalization block")
          source_path.write_text(source.replace(old, new), encoding="utf-8")

          test_path = Path("tests/sampling/test_mahalanobis_support_point_directions.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "test_mahalanobis_support_points_normalizes_extreme_finite_direction"
          if marker in tests:
              raise RuntimeError("Regression test already exists")
          tests = tests.rstrip() + '''


          def test_mahalanobis_support_points_normalizes_extreme_finite_direction() -> None:
              mean = np.zeros(2)
              covariance = np.eye(2)
              direction = np.full(2, np.finfo(np.float64).max)

              with np.errstate(over="raise", invalid="raise", divide="raise"):
                  support = mahalanobis_support_points(mean, covariance, direction)

              expected = np.full(2, 1.0 / np.sqrt(2.0))
              assert np.allclose(support[0], expected)
              assert np.isclose(
                  support[0] @ np.linalg.solve(covariance, support[0]), 1.0
              )
          '''
          test_path.write_text(tests.lstrip("\n"), encoding="utf-8")

          Path(".github/workflows/agent-fix-support-direction-overflow.yml").unlink()
          PY

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run focused regression tests
        run: python -m pytest -q tests/sampling/test_mahalanobis_support_point_directions.py

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pyrecest/sampling/support_points.py tests/sampling/test_mahalanobis_support_point_directions.py .github/workflows/agent-fix-support-direction-overflow.yml
          git commit -m "Stabilize support-point direction normalization"
          git push origin HEAD:agent/fix-support-direction-overflow-20260805
