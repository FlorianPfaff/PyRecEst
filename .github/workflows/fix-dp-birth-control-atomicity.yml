name: Fix DP birth control atomicity

on:
  push:
    branches:
      - agent/fix-dp-birth-control-atomicity

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch implementation and regression tests
        run: |
          echo '' | base64 --decode > /tmp/apply_patch.py
          python /tmp/apply_patch.py

      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest

      - name: Run focused regression tests
        run: python -m pytest tests/filters/test_dirichlet_process_birth_tracker.py -q

      - name: Check formatting and syntax
        run: |
          python -m compileall -q src/pyrecest/filters/dirichlet_process_birth_tracker.py tests/filters/test_dirichlet_process_birth_tracker.py
          git diff --check

      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/fix-dp-birth-control-atomicity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pyrecest/filters/dirichlet_process_birth_tracker.py tests/filters/test_dirichlet_process_birth_tracker.py .github/workflows/fix-dp-birth-control-atomicity.yml
          git commit -m "Make DP birth control failures atomic"
          git push
