name: Patch retrodiction symmetrization

on:
  push:
    branches:
      - agent/stabilize-retrodiction-symmetrization
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/stabilize-retrodiction-symmetrization
          fetch-depth: 0

      - name: Apply source fix and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source_path = Path("src/pyrecest/filters/out_of_sequence.py")
          source = source_path.read_text(encoding="utf-8")

          old_import = (
              "from pyrecest.backend import asarray, atleast_1d, atleast_2d, "
              "float64, linalg, transpose"
          )
          new_import = """from pyrecest.backend import (
              asarray,
              atleast_1d,
              atleast_2d,
              float64,
              isfinite,
              linalg,
              maximum,
              minimum,
              transpose,
              where,
          )"""
          if old_import not in source:
              raise RuntimeError("Expected backend import was not found")
          source = source.replace(old_import, new_import, 1)

          helper = '''

          def _stable_symmetric_average(matrix):
              """Average a matrix with its transpose without finite overflow."""
              transposed = transpose(matrix)
              finite_same_sign = (
                  isfinite(matrix)
                  & isfinite(transposed)
                  & ((matrix >= 0.0) == (transposed >= 0.0))
              )

              same_left = where(finite_same_sign, matrix, 0.0)
              same_right = where(finite_same_sign, transposed, 0.0)
              lower = minimum(same_left, same_right)
              upper = maximum(same_left, same_right)
              same_sign_average = lower + 0.5 * (upper - lower)

              other = ~finite_same_sign
              other_average = 0.5 * where(other, matrix, 0.0) + 0.5 * where(
                  other, transposed, 0.0
              )
              return same_sign_average + other_average
          '''
          marker = "\n\ndef retrodict_linear_gaussian(\n"
          if marker not in source:
              raise RuntimeError("Retrodiction function marker was not found")
          source = source.replace(marker, helper + marker, 1)

          old_symmetrization = (
              "previous_covariance = 0.5 * "
              "(previous_covariance + transpose(previous_covariance))"
          )
          new_symmetrization = (
              "previous_covariance = _stable_symmetric_average(previous_covariance)"
          )
          if old_symmetrization not in source:
              raise RuntimeError("Expected retrodiction symmetrization was not found")
          source = source.replace(old_symmetrization, new_symmetrization, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path(
              "tests/filters/test_out_of_sequence_retrodiction_stability.py"
          )
          test_path.write_text(
              dedent(
                  """\
                  import numpy as np

                  # pylint: disable=no-name-in-module,no-member
                  from pyrecest.backend import allclose, array, float64
                  from pyrecest.filters import retrodict_linear_gaussian


                  def test_retrodiction_preserves_extreme_finite_covariance():
                      largest = np.finfo(np.float64).max
                      covariance = array(
                          [[largest, 0.0], [0.0, largest]],
                          dtype=float64,
                      )

                      with np.errstate(over="raise", invalid="raise"):
                          previous_mean, previous_covariance = retrodict_linear_gaussian(
                              mean=array([0.0, 0.0], dtype=float64),
                              covariance=covariance,
                              system_matrix=array(
                                  [[1.0, 0.0], [0.0, 1.0]],
                                  dtype=float64,
                              ),
                          )

                      assert allclose(
                          previous_mean,
                          array([0.0, 0.0], dtype=float64),
                      )
                      assert allclose(previous_covariance, covariance)
                  """
              ),
              encoding="utf-8",
          )

          Path(
              ".github/workflows/one-shot-retrodiction-symmetrization.yml"
          ).unlink()
          PY

      - name: Validate syntax and stable averaging arithmetic
        shell: bash
        run: |
          python -m py_compile \
            src/pyrecest/filters/out_of_sequence.py \
            tests/filters/test_out_of_sequence_retrodiction_stability.py
          python - <<'PY'
          import math
          import sys

          largest = sys.float_info.max
          smallest = math.nextafter(0.0, 1.0)

          def stable_average(left, right):
              if (
                  math.isfinite(left)
                  and math.isfinite(right)
                  and ((left >= 0.0) == (right >= 0.0))
              ):
                  lower = min(left, right)
                  upper = max(left, right)
                  return lower + 0.5 * (upper - lower)
              return 0.5 * left + 0.5 * right

          assert stable_average(largest, largest) == largest
          assert stable_average(smallest, smallest) == smallest
          assert stable_average(largest, -largest) == 0.0
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pyrecest/filters/out_of_sequence.py \
            tests/filters/test_out_of_sequence_retrodiction_stability.py \
            .github/workflows/one-shot-retrodiction-symmetrization.yml
          git commit -m "Stabilize retrodiction covariance symmetrization"
          git push origin HEAD:agent/stabilize-retrodiction-symmetrization
