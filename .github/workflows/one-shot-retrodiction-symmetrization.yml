name: Finalize retrodiction symmetrization patch

on:
  push:
    branches:
      - agent/stabilize-retrodiction-symmetrization
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/stabilize-retrodiction-symmetrization
          fetch-depth: 0

      - name: Alias backend finiteness helper and remove workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/pyrecest/filters/out_of_sequence.py")
          source = source_path.read_text(encoding="utf-8")

          old_import = "    isfinite,\n"
          new_import = "    isfinite as backend_isfinite,\n"
          if source.count(old_import) != 1:
              raise RuntimeError("Expected exactly one backend isfinite import")
          source = source.replace(old_import, new_import, 1)

          old_helper = """    finite_same_sign = (
              isfinite(matrix)
              & isfinite(transposed)
              & ((matrix >= 0.0) == (transposed >= 0.0))
          )"""
          new_helper = """    finite_same_sign = (
              backend_isfinite(matrix)
              & backend_isfinite(transposed)
              & ((matrix >= 0.0) == (transposed >= 0.0))
          )"""
          if old_helper not in source:
              raise RuntimeError("Expected stable-average finiteness block was not found")
          source = source.replace(old_helper, new_helper, 1)
          source_path.write_text(source, encoding="utf-8")

          Path(
              ".github/workflows/one-shot-retrodiction-symmetrization.yml"
          ).unlink()
          PY

          python -m py_compile \
            src/pyrecest/filters/out_of_sequence.py \
            tests/filters/test_out_of_sequence_retrodiction_stability.py

      - name: Commit final patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pyrecest/filters/out_of_sequence.py \
            .github/workflows/one-shot-retrodiction-symmetrization.yml
          git commit -m "Finalize retrodiction covariance stability fix"
          git push origin HEAD:agent/stabilize-retrodiction-symmetrization
