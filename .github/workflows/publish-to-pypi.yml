name: Publish to PyPI
run-name: Publish to ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_index || 'pypi' }}

on:
  workflow_run:
    workflows:
      - Check for version change, add tag, build, and publish
    types:
      - completed
    branches:
      - main
  #checkov:skip=CKV_GHA_7:workflow_dispatch inputs are intentional for manual release control
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag to publish; leave blank for the latest release"
        required: false
        type: string
      target_index:
        description: "Package index to publish to for manual runs"
        required: true
        type: choice
        default: pypi
        options:
          - testpypi
          - pypi

permissions:
  actions: read
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    outputs:
      package_name: ${{ steps.meta.outputs.package_name }}
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      target_index: ${{ steps.target.outputs.target_index }}
      environment_name: ${{ steps.target.outputs.environment_name }}
      publish_allowed: ${{ steps.gate.outputs.publish_allowed }}
    steps:
      - name: Resolve release metadata
        id: meta
        uses: actions/github-script@v9
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const resolveTagCommit = async (tag) => {
              const response = await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });
              let object = response.data.object;

              for (let depth = 0; depth < 5; depth += 1) {
                if (object.type === "commit") {
                  return object.sha;
                }
                if (object.type !== "tag") {
                  break;
                }

                const tagResponse = await github.rest.git.getTag({
                  owner,
                  repo,
                  tag_sha: object.sha,
                });
                object = tagResponse.data.object;
              }

              throw new Error(`Tag ${tag} does not resolve to a commit.`);
            };

            const readPoetryMetadata = async (ref) => {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path: "pyproject.toml",
                ref,
              });
              const file = response.data;

              if (Array.isArray(file) || file.type !== "file" || !file.content) {
                throw new Error(`pyproject.toml at ${ref} is not a readable file.`);
              }

              const source = Buffer.from(
                file.content,
                file.encoding || "base64",
              ).toString("utf8");
              const sectionHeader = /^\[tool\.poetry\][ \t\r]*$/m;
              const sectionMatch = sectionHeader.exec(source);

              if (!sectionMatch) {
                throw new Error(`pyproject.toml at ${ref} has no [tool.poetry] section.`);
              }

              const sectionStart = source.indexOf("\n", sectionMatch.index) + 1;
              const remainder = source.slice(sectionStart);
              const nextSection = remainder.search(/^\[/m);
              const section = nextSection === -1
                ? remainder
                : remainder.slice(0, nextSection);

              const readString = (key) => {
                const pattern = new RegExp(
                  `^${key}[ \\t]*=[ \\t]*\"([^\"\\r\\n]+)\"[ \\t\\r]*$`,
                  "m",
                );
                const match = pattern.exec(section);
                if (!match) {
                  throw new Error(
                    `pyproject.toml at ${ref} has no quoted ${key} in [tool.poetry].`,
                  );
                }
                return match[1];
              };

              return {
                packageName: readString("name"),
                version: readString("version"),
              };
            };

            let metadataRef;
            let releaseTag;

            if (context.eventName === "workflow_dispatch") {
              const input = (process.env.RELEASE_TAG_INPUT || "").trim();
              let release;

              if (input) {
                const response = await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag: input,
                });
                release = response.data;
              } else {
                const response = await github.rest.repos.getLatestRelease({
                  owner,
                  repo,
                });
                release = response.data;
              }

              if (release.draft) {
                throw new Error(`Release ${release.tag_name} is still a draft.`);
              }

              releaseTag = release.tag_name;
              metadataRef = await resolveTagCommit(releaseTag);
              core.info(`Using metadata from published release ${releaseTag}.`);
            } else {
              metadataRef = context.payload.workflow_run.head_sha;
            }

            const metadata = await readPoetryMetadata(metadataRef);
            releaseTag ||= metadata.version;

            core.setOutput("package_name", metadata.packageName);
            core.setOutput("version", metadata.version);
            core.setOutput("release_tag", releaseTag);

      - name: Resolve target index
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_INDEX="${{ github.event.inputs.target_index }}"
          else
            TARGET_INDEX="pypi"
          fi

          case "${TARGET_INDEX}" in
            testpypi)
              ENVIRONMENT_NAME="testpypi"
              ;;
            pypi)
              ENVIRONMENT_NAME="pypi"
              ;;
            *)
              echo "::error::Unsupported target index: ${TARGET_INDEX}"
              exit 1
              ;;
          esac

          echo "target_index=${TARGET_INDEX}" >> "$GITHUB_OUTPUT"
          echo "environment_name=${ENVIRONMENT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: gate
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        with:
          script: |
            const version = process.env.VERSION;
            const releaseTag = process.env.RELEASE_TAG || version;

            const getRelease = async () => {
              const response = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: releaseTag,
              });
              return response.data;
            };

            if (context.eventName === "workflow_dispatch") {
              try {
                await getRelease();
              } catch (error) {
                if (error.status === 404) {
                  core.setFailed(`No GitHub release found for tag ${releaseTag}.`);
                  return;
                }
                throw error;
              }
              core.setOutput("publish_allowed", "true");
              return;
            }

            const runId = context.payload.workflow_run.id;
            const upstreamStartedAt = Date.parse(
              context.payload.workflow_run.created_at ||
              context.payload.workflow_run.updated_at
            );

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
              }
            );

            const dryRunArtifact = artifacts.find(
              (artifact) => artifact.name === `release-notes-${version}`
            );

            if (dryRunArtifact) {
              core.info(`Upstream run ${runId} was a dry run; skipping publish.`);
              core.setOutput("publish_allowed", "false");
              return;
            }

            let release;
            try {
              release = await getRelease();
            } catch (error) {
              if (error.status === 404) {
                core.info(`No GitHub release found for tag ${releaseTag}; skipping publish.`);
                core.setOutput("publish_allowed", "false");
                return;
              }
              throw error;
            }

            const publishedAt = Date.parse(release.published_at || release.created_at);

            if (
              !Number.isFinite(upstreamStartedAt) ||
              !Number.isFinite(publishedAt) ||
              publishedAt < upstreamStartedAt
            ) {
              core.info(
                `Release ${releaseTag} was not created by the completed upstream run; skipping publish.`
              );
              core.setOutput("publish_allowed", "false");
              return;
            }

            core.setOutput("publish_allowed", "true");

  publish:
    needs: resolve
    if: ${{ needs.resolve.outputs.publish_allowed == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve.outputs.environment_name }}
      url: ${{ needs.resolve.outputs.target_index == 'testpypi' && format('https://test.pypi.org/p/{0}', needs.resolve.outputs.package_name) || format('https://pypi.org/p/{0}', needs.resolve.outputs.package_name) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Prepare dist directory
        shell: bash
        run: mkdir -p dist release-metadata

      - name: Install validation tools
        shell: bash
        run: python -m pip install --upgrade twine

      - name: Download release assets from GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          PACKAGE_NAME: ${{ needs.resolve.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          owner = os.environ["OWNER"]
          repo = os.environ["REPO"]
          release_tag = os.environ["RELEASE_TAG"]
          package_name = os.environ["PACKAGE_NAME"]
          package_version = os.environ["PACKAGE_VERSION"]
          token = os.environ["GITHUB_TOKEN"]
          encoded_release_tag = urllib.parse.quote(release_tag, safe="")

          req = urllib.request.Request(
              f"https://api.github.com/repos/{owner}/{repo}/releases/tags/{encoded_release_tag}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2026-03-10",
              },
          )
          with urllib.request.urlopen(req) as resp:
              release = json.load(resp)

          dist_dir = pathlib.Path("dist")
          metadata_dir = pathlib.Path("release-metadata")
          distribution_name = re.sub(r"[^\w\d.]+", "_", package_name).lower()
          expected_sdist = f"{distribution_name}-{package_version}.tar.gz"
          expected_wheel = f"{distribution_name}-{package_version}-py3-none-any.whl"
          wanted = []

          for asset in release["assets"]:
              name = asset["name"]
              if (
                  name == expected_sdist
                  or name == expected_wheel
                  or name == "SHA256SUMS.txt"
              ):
                  wanted.append(asset)

          unexpected_distribution_assets = sorted(
              asset["name"]
              for asset in release["assets"]
              if (asset["name"].endswith(".whl") or asset["name"].endswith(".tar.gz"))
              and asset not in wanted
          )
          if unexpected_distribution_assets:
              raise SystemExit(
                  f"Unexpected distribution assets on release {release_tag}: "
                  f"{unexpected_distribution_assets}"
              )

          wheel_assets = [asset for asset in wanted if asset["name"].endswith(".whl")]
          sdist_assets = [asset for asset in wanted if asset["name"].endswith(".tar.gz")]
          if not wheel_assets:
              raise SystemExit(f"No wheel asset found on release {release_tag}.")
          if not sdist_assets:
              raise SystemExit(f"No source distribution asset found on release {release_tag}.")
          if not any(asset["name"] == "SHA256SUMS.txt" for asset in wanted):
              raise SystemExit(f"No SHA256SUMS.txt asset found on release {release_tag}.")

          for asset in wanted:
              req = urllib.request.Request(
                  asset["url"],
                  headers={
                      "Accept": "application/octet-stream",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2026-03-10",
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  data = resp.read()

              target_dir = metadata_dir if asset["name"] == "SHA256SUMS.txt" else dist_dir
              target = target_dir / asset["name"]
              target.write_bytes(data)
              print(f"Downloaded {target}")
          PY

      - name: Verify distribution hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import pathlib

          hashes = {}
          dist_dir = pathlib.Path("dist")
          checksum_path = pathlib.Path("release-metadata/SHA256SUMS.txt")
          for line in checksum_path.read_text(encoding="utf-8").splitlines():
              digest, filename = line.split(maxsplit=1)
              if "/" in filename or "\\" in filename:
                  raise SystemExit(f"Unexpected path in SHA256SUMS.txt: {filename}")
              if filename in hashes:
                  raise SystemExit(f"Duplicate distribution file listed in SHA256SUMS.txt: {filename}")
              hashes[filename] = digest

          distribution_files = {
              path.name
              for path in dist_dir.iterdir()
              if path.suffix == ".whl" or path.name.endswith(".tar.gz")
          }
          checksum_files = set(hashes)
          if checksum_files != distribution_files:
              missing = sorted(distribution_files - checksum_files)
              extra = sorted(checksum_files - distribution_files)
              raise SystemExit(
                  "SHA256SUMS.txt does not match downloaded distributions. "
                  f"Missing checksums: {missing or 'none'}; "
                  f"unexpected checksums: {extra or 'none'}"
              )

          for filename, expected_digest in hashes.items():
              path = dist_dir / filename
              actual_digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual_digest != expected_digest:
                  raise SystemExit(f"Hash mismatch for {filename}: expected {expected_digest}, got {actual_digest}")
          PY

      - name: Check distributions
        shell: bash
        run: python -m twine check dist/*.whl dist/*.tar.gz

      - name: Publish to PyPI
        if: ${{ needs.resolve.outputs.target_index == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to TestPyPI
        if: ${{ needs.resolve.outputs.target_index == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
