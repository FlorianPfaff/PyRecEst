name: One-shot replay probability validation patch

permissions:
  contents: write

on:
  push:
    branches:
      - fix/replay-probability-validation-20260823

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply replay validation fixes and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, *, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          source_path = Path("src/pyrecest/filters/goal_conditioned_replay_particle_filter.py")
          source = source_path.read_text()

          source = replace_once(
              source,
              "import copy\nfrom collections.abc import Callable\nfrom numbers import Integral\nfrom typing import Any\n",
              "import copy\nfrom collections.abc import Callable\nfrom math import isfinite as python_isfinite\nfrom numbers import Integral\nfrom typing import Any\n",
              label="stdlib import",
          )

          source = replace_once(
              source,
              '''        n_particles = _as_positive_integer(n_particles, "n_particles")\n        if dt <= 0.0:\n            raise ValueError("dt must be positive")\n\n        self.position_dim = position_dim\n''',
              '''        n_particles = _as_positive_integer(n_particles, "n_particles")\n        try:\n            dt = float(dt)\n        except (TypeError, ValueError, OverflowError) as exc:\n            raise ValueError("dt must be a finite positive scalar") from exc\n        if not python_isfinite(dt) or dt <= 0.0:\n            raise ValueError("dt must be a finite positive scalar")\n\n        self.position_dim = position_dim\n''',
              label="dt validation",
          )
          source = replace_once(
              source,
              "        self.dt = float(dt)\n",
              "        self.dt = dt\n",
              label="dt assignment",
          )

          source = replace_once(
              source,
              '''    @staticmethod\n    def _validate_probability_vector(vector, expected_size: int, name: str):\n        vector = atleast_1d(array(vector))\n        if vector.shape != (expected_size,):\n            raise ValueError(f"{name} must have shape ({expected_size},)")\n        if float(sum(vector)) <= 0.0:\n            raise ValueError(f"{name} must have positive total mass")\n        for value in vector:\n            if float(value) < 0.0:\n                raise ValueError(f"{name} must not contain negative entries")\n        return vector / sum(vector)\n''',
              '''    @staticmethod\n    def _validate_probability_vector(vector, expected_size: int, name: str):\n        vector = atleast_1d(array(vector))\n        if vector.shape != (expected_size,):\n            raise ValueError(f"{name} must have shape ({expected_size},)")\n        for value in vector:\n            scalar = float(value)\n            if not python_isfinite(scalar):\n                raise ValueError(f"{name} must contain only finite entries")\n            if scalar < 0.0:\n                raise ValueError(f"{name} must not contain negative entries")\n        total = float(sum(vector))\n        if not python_isfinite(total) or total <= 0.0:\n            raise ValueError(f"{name} must have finite positive total mass")\n        return vector / total\n''',
              label="probability vector validation",
          )

          source = replace_once(
              source,
              '''        if goal_prior_weights is None:\n            goal_prior_weights = ones((n_goals,)) / n_goals\n        else:\n            goal_prior_weights = atleast_1d(array(goal_prior_weights))\n            if goal_prior_weights.shape != (n_goals,):\n                raise ValueError(\n                    "goal_prior_weights must have one weight per candidate goal"\n                )\n            if self._to_scalar(sum(goal_prior_weights)) <= 0.0:\n                raise ValueError("goal_prior_weights must have positive total mass")\n            if any(self._to_scalar(weight) < 0.0 for weight in goal_prior_weights):\n                raise ValueError("goal_prior_weights must be nonnegative")\n            goal_prior_weights = goal_prior_weights / sum(goal_prior_weights)\n\n        self._candidate_goals = candidate_goals\n''',
              '''        if goal_prior_weights is None:\n            goal_prior_weights = ones((n_goals,)) / n_goals\n        else:\n            goal_prior_weights = self._validate_probability_vector(\n                goal_prior_weights,\n                n_goals,\n                "goal_prior_weights",\n            )\n\n        self._candidate_goals = candidate_goals\n''',
              label="stored goal weight validation",
          )

          source = replace_once(
              source,
              '''        if goal_prior_weights is None:\n            goal_prior_weights = ones((n_goals,)) / n_goals\n        else:\n            goal_prior_weights = atleast_1d(array(goal_prior_weights))\n            if goal_prior_weights.shape != (n_goals,):\n                raise ValueError(\n                    "goal_prior_weights must have one weight per candidate goal"\n                )\n            if self._to_scalar(sum(goal_prior_weights)) <= 0.0:\n                raise ValueError("goal_prior_weights must have positive total mass")\n            goal_prior_weights = goal_prior_weights / sum(goal_prior_weights)\n\n        indices = random.choice(\n''',
              '''        if goal_prior_weights is None:\n            goal_prior_weights = ones((n_goals,)) / n_goals\n        else:\n            goal_prior_weights = self._validate_probability_vector(\n                goal_prior_weights,\n                n_goals,\n                "goal_prior_weights",\n            )\n\n        indices = random.choice(\n''',
              label="sampled goal weight validation",
          )

          source_path.write_text(source)

          test_path = Path("tests/filters/test_goal_conditioned_replay_particle_filter.py")
          tests = test_path.read_text()
          tests = replace_once(
              tests,
              '''        for kwargs in invalid_arguments:\n            with self.subTest(kwargs=kwargs), self.assertRaises(ValueError):\n                GoalConditionedReplayParticleFilter(**kwargs)\n\n    def test_predict_replay_moves_velocity_toward_goal(self):\n''',
              '''        for kwargs in invalid_arguments:\n            with self.subTest(kwargs=kwargs), self.assertRaises(ValueError):\n                GoalConditionedReplayParticleFilter(**kwargs)\n\n    def test_constructor_rejects_nonfinite_dt(self):\n        for dt in (np.nan, np.inf):\n            with self.subTest(dt=dt), self.assertRaisesRegex(\n                ValueError, "finite positive scalar"\n            ):\n                GoalConditionedReplayParticleFilter(\n                    n_particles=4,\n                    position_dim=2,\n                    dt=dt,\n                )\n\n    def test_candidate_goal_weights_reject_nonfinite_values(self):\n        filt = GoalConditionedReplayParticleFilter(\n            n_particles=8,\n            position_dim=2,\n        )\n        candidate_goals = array([[0.0, 0.0], [1.0, 0.0]])\n\n        for weights in (array([np.nan, 1.0]), array([np.inf, 1.0])):\n            with self.subTest(weights=weights), self.assertRaisesRegex(\n                ValueError, "goal_prior_weights"\n            ):\n                filt.set_candidate_goals(candidate_goals, weights)\n\n    def test_direct_goal_sampling_rejects_negative_weights(self):\n        filt = GoalConditionedReplayParticleFilter(\n            n_particles=8,\n            position_dim=2,\n        )\n        candidate_goals = array([[0.0, 0.0], [1.0, 0.0]])\n\n        with self.assertRaisesRegex(ValueError, "goal_prior_weights"):\n            filt.sample_goals_from_candidates(\n                candidate_goals,\n                array([-0.25, 1.25]),\n            )\n\n    def test_predict_replay_moves_velocity_toward_goal(self):\n''',
              label="regression tests",
          )
          test_path.write_text(tests)

          Path(".github/workflows/one-shot-replay-probability-validation.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix replay probability validation"
          git push origin HEAD:${GITHUB_REF_NAME}
