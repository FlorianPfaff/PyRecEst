name: Apply mixed-boolean weak-measurement fix

on:
  push:
    branches:
      - agent/reject-mixed-boolean-weak-measurements

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/reject-mixed-boolean-weak-measurements
          fetch-depth: 0

      - name: Apply source and regression-test changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/pyrecest/models/weak_measurement.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''def _contains_non_real_numeric_values(value: Any) -> bool:
              return _array_contains_non_real_numeric_values(np.asarray(value))
          '''
          new = '''def _contains_non_real_numeric_values(value: Any) -> bool:
              if _value_contains_non_real_numeric_values(value):
                  return True
              return _array_contains_non_real_numeric_values(np.asarray(value))
          '''
          if source.count(old) != 1:
              raise RuntimeError("expected weak-measurement validator implementation was not found exactly once")
          source_path.write_text(source.replace(old, new), encoding="utf-8")

          test_path = Path("tests/models/test_weak_measurement_mixed_boolean_inputs.py")
          test_path.write_text(
              '''from __future__ import annotations

          import numpy as np
          import pytest
          from pyrecest.models import (
              MaskedLinearMeasurementModel,
              WeakDimensionMeasurementModel,
              block_diag_measurement_covariance,
              diagonal_measurement_covariance,
          )


          @pytest.mark.parametrize(
              "stds",
              (
                  [1.0, True],
                  (2.0, np.bool_(False)),
                  [[1.0, True]],
              ),
          )
          def test_mixed_boolean_standard_deviations_are_rejected(stds) -> None:
              with pytest.raises(ValueError, match="real numeric values"):
                  diagonal_measurement_covariance(stds)
              with pytest.raises(ValueError, match="real numeric values"):
                  block_diag_measurement_covariance(trusted_std=stds)
              with pytest.raises(ValueError, match="real numeric values"):
                  MaskedLinearMeasurementModel(
                      state_dim=2,
                      observed_dims=[0, 1],
                      stds=stds,
                  )
              with pytest.raises(ValueError, match="real numeric values"):
                  WeakDimensionMeasurementModel(np.eye(2), stds=stds)


          @pytest.mark.parametrize(
              "measurement_noise_cov",
              (
                  [[1.0, 0.0], [True, 2.0]],
                  ((1.0, np.bool_(False)), (0.0, 2.0)),
              ),
          )
          def test_mixed_boolean_measurement_covariances_are_rejected(
              measurement_noise_cov,
          ) -> None:
              with pytest.raises(ValueError, match="measurement_noise_cov"):
                  MaskedLinearMeasurementModel(
                      state_dim=2,
                      observed_dims=[0, 1],
                      measurement_noise_cov=measurement_noise_cov,
                  )
              with pytest.raises(ValueError, match="measurement_noise_cov"):
                  WeakDimensionMeasurementModel(
                      np.eye(2),
                      measurement_noise_cov=measurement_noise_cov,
                  )


          def test_mixed_python_numeric_sequences_remain_supported() -> None:
              covariance = diagonal_measurement_covariance([1, 2.5])
              assert np.allclose(covariance, np.diag([1.0, 6.25]))

              model = WeakDimensionMeasurementModel(
                  [[1, 0.0], [0, 1.0]],
                  measurement_noise_cov=[[1, 0.0], [0, 2.0]],
              )
              assert np.allclose(model.measurement_noise_cov, np.diag([1.0, 2.0]))
          ''',
              encoding="utf-8",
          )
          PY

          python -m py_compile \
            src/pyrecest/models/weak_measurement.py \
            tests/models/test_weak_measurement_mixed_boolean_inputs.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-reject-mixed-boolean-weak-measurements.yml
          git add \
            src/pyrecest/models/weak_measurement.py \
            tests/models/test_weak_measurement_mixed_boolean_inputs.py
          git commit -m "Reject mixed boolean weak measurement inputs"
          git push origin HEAD:agent/reject-mixed-boolean-weak-measurements
