name: Apply NEES/NIS covariance validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/validate-nees-nis-covariances
          fetch-depth: 0

      - name: Apply source and regression patch
        run: python .github/scripts/apply_nees_nis_covariance_patch.py

      - name: Validate syntax and patch scope
        shell: bash
        run: |
          python -m py_compile \
            src/pyrecest/utils/metrics.py \
            tests/test_metrics_covariance_validation.py
          git diff --check

      - name: Commit patch and remove temporary helpers
        shell: bash
        run: |
          rm .github/scripts/apply_nees_nis_covariance_patch.py
          rm .github/workflows/agent-nees-nis-covariance-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pyrecest/utils/metrics.py \
            tests/test_metrics_covariance_validation.py \
            .github/scripts/apply_nees_nis_covariance_patch.py \
            .github/workflows/agent-nees-nis-covariance-patch.yml
          git diff --cached --check
          git commit -m "Validate NEES and NIS covariance matrices"
          git push origin HEAD:agent/validate-nees-nis-covariances
