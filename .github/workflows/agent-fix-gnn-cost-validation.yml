name: Agent fix GNN cost validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/reject-invalid-gnn-cost-inputs' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply focused fix and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/pyrecest/filters/track_manager.py')
          source = source_path.read_text(encoding='utf-8')

          matrix_old = """    matrix = np.asarray(cost_matrix, dtype=float)\n    if matrix.ndim != 2:\n"""
          matrix_new = """    matrix = _as_real_cost_array(cost_matrix, \"cost_matrix\")\n    if matrix.ndim != 2:\n"""
          if source.count(matrix_old) != 1:
              raise RuntimeError('Could not locate the GNN cost-matrix conversion')
          source = source.replace(matrix_old, matrix_new)

          helper_anchor = "\ndef _forbidden_assignment_cost(assignment_size: int, *cost_arrays: Any) -> float:\n"
          helper = '''

def _contains_masked_or_complex_cost(
    value: Any, active_ids: Optional[set[int]] = None
) -> bool:
    """Return whether a cost input contains masked or complex values."""

    if np.ma.is_masked(value) or isinstance(value, (complex, np.complexfloating)):
        return True
    if active_ids is None:
        active_ids = set()
    value_id = id(value)
    if value_id in active_ids:
        return True
    active_ids.add(value_id)
    try:
        try:
            value_array = np.asarray(value)
        except (TypeError, ValueError, OverflowError, RuntimeError):
            return False
        if value_array.dtype.kind == "c":
            return True
        if value_array.dtype.kind != "O":
            return False
        return any(
            _contains_masked_or_complex_cost(item, active_ids)
            for item in value_array.flat
        )
    finally:
        active_ids.remove(value_id)


def _as_real_cost_array(value: Any, name: str) -> np.ndarray:
    """Convert cost input to float without silently discarding information."""

    if _contains_masked_or_complex_cost(value):
        raise ValueError(
            f"{name} must contain only unmasked real numeric values"
        )
    try:
        return np.asarray(value, dtype=float)
    except (TypeError, ValueError, OverflowError, RuntimeError) as exc:
        raise ValueError(f"{name} must contain numeric values") from exc
'''
          if source.count(helper_anchor) != 1:
              raise RuntimeError('Could not locate the GNN cost helper insertion point')
          source = source.replace(helper_anchor, helper + helper_anchor)

          vector_old = '''    cost_array = np.asarray(cost)
    if cost_array.shape == ():
        return np.full(length, float(cost_array.item()))

    vector = np.asarray(cost, dtype=float).reshape(-1)
'''
          vector_new = '''    cost_array = _as_real_cost_array(cost, name)
    if cost_array.shape == ():
        return np.full(length, float(cost_array.item()))

    vector = cost_array.reshape(-1)
'''
          if source.count(vector_old) != 1:
              raise RuntimeError('Could not locate the unassigned-cost conversion')
          source = source.replace(vector_old, vector_new)

          forbidden_old = '        values = np.asarray(costs, dtype=float).reshape(-1)\n'
          forbidden_new = '        values = _as_real_cost_array(costs, "assignment costs").reshape(-1)\n'
          if source.count(forbidden_old) != 1:
              raise RuntimeError('Could not locate the structural-cost conversion')
          source = source.replace(forbidden_old, forbidden_new)

          source_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/filters/test_track_manager_cost_validation.py')
          test_path.write_text(
              '''import unittest

import numpy as np
from pyrecest.filters.track_manager import solve_global_nearest_neighbor


class TrackManagerCostValidationTest(unittest.TestCase):
    def test_solver_rejects_complex_cost_matrices(self):
        invalid_cost_matrices = (
            np.array([[0.0 + 2.0j, 10.0], [10.0, 0.0]]),
            np.array([[0.0 + 2.0j]], dtype=object),
        )

        for cost_matrix in invalid_cost_matrices:
            with self.subTest(dtype=cost_matrix.dtype):
                with self.assertRaisesRegex(ValueError, "cost_matrix.*unmasked real"):
                    solve_global_nearest_neighbor(
                        cost_matrix,
                        unassigned_track_cost=5.0,
                        unassigned_measurement_cost=5.0,
                    )

    def test_solver_rejects_complex_unassigned_cost_vectors(self):
        with self.assertRaisesRegex(
            ValueError, "unassigned_track_cost.*unmasked real"
        ):
            solve_global_nearest_neighbor(
                np.array([[0.0, 10.0], [10.0, 0.0]]),
                unassigned_track_cost=np.array([5.0 + 3.0j, 5.0]),
                unassigned_measurement_cost=5.0,
            )

    def test_solver_rejects_masked_cost_inputs(self):
        masked_matrix = np.ma.array(
            [[0.0, 10.0], [10.0, 0.0]],
            mask=[[True, False], [False, False]],
        )
        with self.assertRaisesRegex(ValueError, "cost_matrix.*unmasked real"):
            solve_global_nearest_neighbor(
                masked_matrix,
                unassigned_track_cost=5.0,
                unassigned_measurement_cost=5.0,
            )

        masked_unassigned_cost = np.ma.array([5.0, 5.0], mask=[False, True])
        with self.assertRaisesRegex(
            ValueError, "unassigned_track_cost.*unmasked real"
        ):
            solve_global_nearest_neighbor(
                np.array([[0.0, 10.0], [10.0, 0.0]]),
                unassigned_track_cost=masked_unassigned_cost,
                unassigned_measurement_cost=5.0,
            )

    def test_solver_accepts_masked_arrays_without_masked_entries(self):
        association = solve_global_nearest_neighbor(
            np.ma.array(
                [[0.0, 10.0], [10.0, 0.0]],
                mask=False,
            ),
            unassigned_track_cost=np.ma.array([5.0, 5.0], mask=False),
            unassigned_measurement_cost=5.0,
        )

        self.assertEqual(association.matches, [(0, 0), (1, 1)])
        self.assertEqual(association.unmatched_track_indices, [])
        self.assertEqual(association.unmatched_measurement_indices, [])


if __name__ == "__main__":
    unittest.main()
''',
              encoding='utf-8',
          )

          Path('.github/workflows/agent-fix-gnn-cost-validation.yml').unlink()
          PY

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest

      - name: Validate focused regression
        run: |
          python -m py_compile src/pyrecest/filters/track_manager.py tests/filters/test_track_manager_cost_validation.py
          python -m pytest -q tests/filters/test_track_manager.py tests/filters/test_track_manager_structural_cost.py tests/filters/test_track_manager_cost_validation.py

      - name: Commit final patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reject invalid GNN cost inputs'
          git push origin HEAD:${{ github.head_ref }}
