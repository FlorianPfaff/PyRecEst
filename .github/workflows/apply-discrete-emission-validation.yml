name: Apply discrete emission validation

on:
  push:
    branches:
      - agent/reject-invalid-discrete-emissions
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]' && (github.head_ref == 'agent/reject-invalid-discrete-emissions' || github.ref_name == 'agent/reject-invalid-discrete-emissions')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reject invalid non-finite emissions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pyrecest/filters/discrete_state.py')
          source = path.read_text(encoding='utf-8')

          old_doc = "Non-finite entries are returned as zero in ``scaled``."
          new_doc = (
              "``-np.inf`` entries are returned as zero in ``scaled``; "
              "NaN and positive infinity are rejected."
          )
          if source.count(old_doc) != 1:
              raise RuntimeError(
                  f'unexpected scaled_emissions documentation anchor count: '
                  f'{source.count(old_doc)}'
              )
          source = source.replace(old_doc, new_doc, 1)

          old_validation = '''    if values.shape[0] == 0 or values.shape[1] == 0:
              raise ValueError(
                  "log_likelihood must contain at least one time step and one state"
              )
          finite = np.isfinite(values)
          '''
          new_validation = '''    if values.shape[0] == 0 or values.shape[1] == 0:
              raise ValueError(
                  "log_likelihood must contain at least one time step and one state"
              )
          if np.any(np.isnan(values)) or np.any(np.isposinf(values)):
              raise ValueError(
                  "log_likelihood must contain finite values or -np.inf"
              )
          finite = np.isfinite(values)
          '''
          if source.count(old_validation) != 1:
              raise RuntimeError(
                  f'unexpected scaled_emissions validation anchor count: '
                  f'{source.count(old_validation)}'
              )
          path.write_text(
              source.replace(old_validation, new_validation, 1),
              encoding='utf-8',
          )
          PY

      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest

      - name: Run discrete-state regressions
        run: |
          python -m pytest \
            tests/filters/test_discrete_state.py \
            tests/filters/test_discrete_state_complex_inputs.py \
            tests/filters/test_discrete_state_nonfinite_emissions.py \
            -q

      - name: Check syntax and whitespace
        run: |
          python -m compileall -q \
            src/pyrecest/filters/discrete_state.py \
            tests/filters/test_discrete_state_nonfinite_emissions.py
          git diff --check

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-discrete-emission-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pyrecest/filters/discrete_state.py \
            .github/workflows/apply-discrete-emission-validation.yml
          git commit -m "Reject invalid discrete-state emissions"
          git push origin HEAD:agent/reject-invalid-discrete-emissions
