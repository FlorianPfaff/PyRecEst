name: Apply MEM-RBPF FFBSi weight fix

on:
  push:
    branches:
      - agent/stabilize-mem-rbpf-ffbsi-weights
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply focused fix and regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source_path = Path("src/pyrecest/smoothers/mem_rbpf_ffbsi_smoother.py")
          source = source_path.read_text(encoding="utf-8")
          old = (
              "    @staticmethod\n"
              "    def _safe_probs(weights):\n"
              "        weights = np.asarray(weights, dtype=float).reshape(-1)\n"
              "        weights = np.where(np.isfinite(weights), weights, 0.0)\n"
              "        weights = np.maximum(weights, 0.0)\n"
              "        total = float(np.sum(weights))\n"
              "        if total <= 0.0:\n"
              "            return np.full(weights.shape, 1.0 / weights.size)\n"
              "        return weights / total\n"
          )
          new = (
              "    @staticmethod\n"
              "    def _safe_probs(weights):\n"
              "        weights = np.asarray(weights, dtype=float).reshape(-1)\n"
              "        weights = np.where(np.isfinite(weights), weights, 0.0)\n"
              "        weights = np.maximum(weights, 0.0)\n"
              "        if weights.size == 0:\n"
              "            raise ValueError(\"weights must not be empty\")\n"
              "        scale = float(np.max(weights))\n"
              "        if scale <= 0.0:\n"
              "            return np.full(weights.shape, 1.0 / weights.size)\n"
              "        scaled = weights / scale\n"
              "        return scaled / float(np.sum(scaled))\n"
          )
          if old not in source:
              raise SystemExit("expected _safe_probs implementation was not found")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/smoothers/test_mem_rbpf_ffbsi_weight_normalization.py")
          test_path.write_text(
              dedent(
                  """\
                  import numpy as np
                  import numpy.testing as npt
                  import pytest
                  from pyrecest import backend
                  from pyrecest.smoothers import MEMRBPFFFBSiSmoother, MEMRBPFForwardRecord

                  pytestmark = pytest.mark.skipif(
                      backend.__backend_name__ != "numpy",
                      reason="MEM-RBPF FFBSi tests use NumPy sampling paths",
                  )


                  def test_safe_probs_preserves_extreme_finite_weight_ratios():
                      max_float = np.finfo(float).max

                      probabilities = MEMRBPFFFBSiSmoother._safe_probs(
                          np.array([max_float, max_float / 2.0, 0.0])
                      )

                      npt.assert_allclose(
                          probabilities, np.array([2.0 / 3.0, 1.0 / 3.0, 0.0])
                      )
                      npt.assert_allclose(np.sum(probabilities), 1.0)


                  def test_smooth_accepts_extreme_finite_particle_weights():
                      max_float = np.finfo(float).max
                      axis_covariance = np.repeat(
                          (0.1 * np.eye(2))[np.newaxis, :, :], 2, axis=0
                      )
                      record = MEMRBPFForwardRecord(
                          kinematic_state=np.array([0.0]),
                          covariance=np.array([[1.0]]),
                          theta=np.array([0.0, 0.2]),
                          axis_mean=np.array([[2.0, 1.0], [1.8, 0.8]]),
                          axis_covariance=axis_covariance,
                          weights=np.array([max_float, max_float / 2.0]),
                      )

                      result = MEMRBPFFFBSiSmoother(
                          n_trajectories=8, sample_axis=False
                      ).smooth([record], rng=0, full_axis_lengths=False)

                      assert result.index_samples.shape == (8, 1)
                      assert np.all(np.isfinite(result.states))
                  """
              ),
              encoding="utf-8",
          )
          PY

      - name: Validate patched algorithm and syntax
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check numpy
          python -m py_compile \
            src/pyrecest/smoothers/mem_rbpf_ffbsi_smoother.py \
            tests/smoothers/test_mem_rbpf_ffbsi_weight_normalization.py
          python - <<'PY'
          import ast
          from pathlib import Path

          import numpy as np
          import numpy.testing as npt

          tree = ast.parse(
              Path("src/pyrecest/smoothers/mem_rbpf_ffbsi_smoother.py").read_text(
                  encoding="utf-8"
              )
          )
          function = None
          for node in tree.body:
              if isinstance(node, ast.ClassDef) and node.name == "MEMRBPFFFBSiSmoother":
                  for item in node.body:
                      if isinstance(item, ast.FunctionDef) and item.name == "_safe_probs":
                          function = item
                          break
          if function is None:
              raise SystemExit("_safe_probs was not found")
          function.decorator_list = []
          module = ast.Module(body=[function], type_ignores=[])
          ast.fix_missing_locations(module)
          namespace = {"np": np}
          exec(compile(module, "<safe_probs>", "exec"), namespace)

          max_float = np.finfo(float).max
          probabilities = namespace["_safe_probs"](
              np.array([max_float, max_float / 2.0, 0.0])
          )
          npt.assert_allclose(
              probabilities, np.array([2.0 / 3.0, 1.0 / 3.0, 0.0])
          )
          npt.assert_allclose(np.sum(probabilities), 1.0)
          PY

      - name: Replace bootstrap commits with focused fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/apply-mem-rbpf-ffbsi-weight-fix.yml
          git add -A
          git reset --soft origin/main
          git commit -m "Stabilize MEM-RBPF FFBSi weight normalization"
          git push --force-with-lease origin HEAD:agent/stabilize-mem-rbpf-ffbsi-weights
