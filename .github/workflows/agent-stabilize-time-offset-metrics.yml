name: Stabilize time-offset metrics

on:
  push:
    branches:
      - agent/stabilize-time-offset-metrics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-time-offset-metrics
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply numerical-stability fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pyrecest/calibration/time_offset.py")
          text = path.read_text()

          def replace_once(source: str, old: str, new: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"expected one match, found {count}")
              return source.replace(old, new, 1)

          text = replace_once(
              text,
              '''    errors = np.linalg.norm(
                  measurement_values[valid] - reference_at_query[valid], axis=1
              )
          ''',
              '''    with np.errstate(over="ignore", invalid="ignore"):
                  residuals = measurement_values[valid] - reference_at_query[valid]
              errors = _stable_row_norms(residuals)
          ''',
          )

          old_aggregation = '''def _aggregate_summary_metric(
              key: str, values: np.ndarray, counts: np.ndarray
          ) -> float:
              valid = np.isfinite(values) & (counts > 0.0)
              if not valid.any():
                  return float("nan")
              if key == "rmse":
                  return float(np.sqrt(np.average(values[valid] ** 2, weights=counts[valid])))
              if key == "max":
                  return float(np.max(values[valid]))
              return float(np.average(values[valid], weights=counts[valid]))


          def _aggregate_std_metric(
              stds: np.ndarray, means: np.ndarray, counts: np.ndarray
          ) -> float:
              valid = np.isfinite(stds) & np.isfinite(means) & (counts > 0.0)
              if not valid.any():
                  return float("nan")
              weights = counts[valid]
              pooled_mean = float(np.average(means[valid], weights=weights))
              second_moment = float(
                  np.average(stds[valid] ** 2 + means[valid] ** 2, weights=weights)
              )
              return float(np.sqrt(max(0.0, second_moment - pooled_mean**2)))


          '''
          new_aggregation = '''def _scaled_positive_weights(weights: np.ndarray) -> np.ndarray:
              # Rescale positive weights to avoid overflow in reductions.
              scale = float(np.max(weights))
              if not np.isfinite(scale) or scale <= 0.0:
                  raise ValueError("weights must contain positive finite values")
              return weights / scale


          def _stable_weighted_average(values: np.ndarray, weights: np.ndarray) -> float:
              # Compute a weighted average without overflowing products or sums.
              value_scale = float(np.max(np.abs(values)))
              if value_scale == 0.0:
                  return 0.0
              scaled_weights = _scaled_positive_weights(weights)
              return float(
                  value_scale
                  * np.average(values / value_scale, weights=scaled_weights)
              )


          def _stable_weighted_root_mean_square(
              values: np.ndarray, weights: np.ndarray
          ) -> float:
              # Compute a weighted RMS while preserving large finite values.
              value_scale = float(np.max(np.abs(values)))
              if value_scale == 0.0:
                  return 0.0
              scaled_values = values / value_scale
              scaled_weights = _scaled_positive_weights(weights)
              return float(
                  value_scale
                  * np.sqrt(
                      np.average(scaled_values * scaled_values, weights=scaled_weights)
                  )
              )


          def _stable_row_norms(values: np.ndarray) -> np.ndarray:
              # Compute Euclidean row norms without squaring at the original scale.
              values = np.asarray(values, dtype=float)
              if values.ndim != 2:
                  raise ValueError("values must be two-dimensional")
              if values.shape[0] == 0:
                  return np.empty(0, dtype=float)

              scales = np.max(np.abs(values), axis=1)
              norms = np.zeros(values.shape[0], dtype=float)
              finite_positive = np.isfinite(scales) & (scales > 0.0)
              if finite_positive.any():
                  scaled = values[finite_positive] / scales[finite_positive, None]
                  norms[finite_positive] = scales[finite_positive] * np.sqrt(
                      np.sum(scaled * scaled, axis=1)
                  )
              norms[np.isposinf(scales)] = np.inf
              norms[np.isnan(scales)] = np.nan
              return norms


          def _stable_error_moments(errors: np.ndarray) -> tuple[float, float, float]:
              # Return mean, population standard deviation, and RMS stably.
              scale = float(np.max(np.abs(errors)))
              if scale == 0.0:
                  return 0.0, 0.0, 0.0
              scaled = errors / scale
              mean = scale * float(np.mean(scaled))
              std = scale * float(np.std(scaled))
              rmse = scale * float(np.sqrt(np.mean(scaled * scaled)))
              return mean, std, rmse


          def _aggregate_summary_metric(
              key: str, values: np.ndarray, counts: np.ndarray
          ) -> float:
              valid = np.isfinite(values) & (counts > 0.0)
              if not valid.any():
                  return float("nan")
              valid_values = values[valid]
              valid_counts = counts[valid]
              if key == "rmse":
                  return _stable_weighted_root_mean_square(
                      valid_values, valid_counts
                  )
              if key == "max":
                  return float(np.max(valid_values))
              return _stable_weighted_average(valid_values, valid_counts)


          def _aggregate_std_metric(
              stds: np.ndarray, means: np.ndarray, counts: np.ndarray
          ) -> float:
              valid = np.isfinite(stds) & np.isfinite(means) & (counts > 0.0)
              if not valid.any():
                  return float("nan")

              valid_stds = stds[valid]
              valid_means = means[valid]
              scaled_weights = _scaled_positive_weights(counts[valid])
              scale = float(
                  max(np.max(np.abs(valid_stds)), np.max(np.abs(valid_means)))
              )
              if scale == 0.0:
                  return 0.0

              scaled_stds = valid_stds / scale
              scaled_means = valid_means / scale
              pooled_mean = float(
                  np.average(scaled_means, weights=scaled_weights)
              )
              pooled_variance = float(
                  np.average(
                      scaled_stds * scaled_stds
                      + (scaled_means - pooled_mean) ** 2,
                      weights=scaled_weights,
                  )
              )
              return float(scale * np.sqrt(max(0.0, pooled_variance)))


          '''
          text = replace_once(text, old_aggregation, new_aggregation)

          old_error_stats = '''def _error_stats(
              offset_s: float, errors: np.ndarray, *, total_count: int
          ) -> dict[str, float]:
              errors = np.asarray(errors, dtype=float).reshape(-1)
              errors = errors[np.isfinite(errors)]
              if errors.size == 0:
                  return {
                      "time_offset_s": float(offset_s),
                      "count": 0.0,
                      "coverage": 0.0 if total_count else float("nan"),
                      "mean": float("nan"),
                      "std": float("nan"),
                      "rmse": float("nan"),
                      "p95": float("nan"),
                      "max": float("nan"),
                  }
              return {
                  "time_offset_s": float(offset_s),
                  "count": float(errors.size),
                  "coverage": (
                      float(errors.size / total_count) if total_count > 0 else float("nan")
                  ),
                  "mean": float(np.mean(errors)),
                  "std": float(np.std(errors)),
                  "rmse": float(np.sqrt(np.mean(errors**2))),
                  "p95": float(np.percentile(errors, 95)),
                  "max": float(np.max(errors)),
              }
          '''
          new_error_stats = '''def _error_stats(
              offset_s: float, errors: np.ndarray, *, total_count: int
          ) -> dict[str, float]:
              errors = np.asarray(errors, dtype=float).reshape(-1)
              errors = errors[np.isfinite(errors)]
              if errors.size == 0:
                  return {
                      "time_offset_s": float(offset_s),
                      "count": 0.0,
                      "coverage": 0.0 if total_count else float("nan"),
                      "mean": float("nan"),
                      "std": float("nan"),
                      "rmse": float("nan"),
                      "p95": float("nan"),
                      "max": float("nan"),
                  }
              mean, std, rmse = _stable_error_moments(errors)
              return {
                  "time_offset_s": float(offset_s),
                  "count": float(errors.size),
                  "coverage": (
                      float(errors.size / total_count) if total_count > 0 else float("nan")
                  ),
                  "mean": mean,
                  "std": std,
                  "rmse": rmse,
                  "p95": float(np.percentile(errors, 95)),
                  "max": float(np.max(errors)),
              }
          '''
          text = replace_once(text, old_error_stats, new_error_stats)
          path.write_text(text)

          test_path = Path(
              "tests/calibration/test_time_offset_numerical_stability.py"
          )
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text(
              '''import numpy as np
          import pytest

          from pyrecest.calibration.time_offset import (
              aggregate_time_offset_sweeps,
              time_offset_error_summary,
          )


          def _large_finite_value() -> float:
              return float(np.finfo(float).max * 0.75)


          def test_time_offset_error_summary_preserves_large_finite_errors():
              large = _large_finite_value()
              times = np.array([0.0, 1.0])

              with np.errstate(over="raise", invalid="raise"):
                  summary = time_offset_error_summary(
                      times,
                      np.array([[large], [large]]),
                      times,
                      np.zeros((2, 1)),
                      0.0,
                  )

              assert summary["count"] == 2.0
              assert summary["coverage"] == 1.0
              assert summary["mean"] == pytest.approx(large)
              assert summary["std"] == 0.0
              assert summary["rmse"] == pytest.approx(large)
              assert summary["p95"] == pytest.approx(large)
              assert summary["max"] == pytest.approx(large)


          def test_aggregate_time_offset_sweeps_preserves_large_finite_metrics():
              large = _large_finite_value()
              row = {
                  "time_offset_s": 0.0,
                  "count": 1.0,
                  "coverage": 1.0,
                  "mean": large,
                  "std": 0.0,
                  "rmse": large,
                  "p95": large,
                  "max": large,
              }

              with np.errstate(over="raise", invalid="raise"):
                  aggregated = aggregate_time_offset_sweeps(
                      [[dict(row)], [dict(row)]]
                  )

              assert len(aggregated) == 1
              result = aggregated[0]
              assert result["count"] == 2.0
              assert result["mean"] == pytest.approx(large)
              assert result["std"] == 0.0
              assert result["rmse"] == pytest.approx(large)
              assert result["p95"] == pytest.approx(large)
              assert result["max"] == pytest.approx(large)
          '''
          )
          PY

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run focused regression
        run: |
          python -m pytest tests/calibration/test_time_offset_numerical_stability.py -q
          python -m compileall -q src/pyrecest/calibration/time_offset.py tests/calibration/test_time_offset_numerical_stability.py
          git diff --check

      - name: Commit fix and remove bootstrap workflow
        shell: bash
        run: |
          rm .github/workflows/agent-stabilize-time-offset-metrics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pyrecest/calibration/time_offset.py tests/calibration/test_time_offset_numerical_stability.py .github/workflows/agent-stabilize-time-offset-metrics.yml
          git commit -m "Stabilize time-offset error metrics"
          git push origin HEAD:agent/stabilize-time-offset-metrics
