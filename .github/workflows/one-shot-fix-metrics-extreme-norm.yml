name: One-shot metrics norm fix

on:
  push:
    branches:
      - agent/fix-metrics-extreme-norm-20260731

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-metrics-extreme-norm-20260731
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply focused source and regression changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          metrics_path = Path("src/pyrecest/utils/metrics.py")
          source = metrics_path.read_text(encoding="utf-8")
          old = '''def _pairwise_distances(
              estimated: np.ndarray, reference: np.ndarray, distance_fn: DistanceFunction | None
          ) -> np.ndarray:
              if distance_fn is None:
                  differences = estimated[:, None, :] - reference[None, :, :]
                  return np.linalg.norm(differences, axis=-1)
              distances = np.empty((estimated.shape[0], reference.shape[0]), dtype=float)
              for row, estimate in enumerate(estimated):
                  for col, truth in enumerate(reference):
                      distances[row, col] = float(distance_fn(estimate, truth))
              return distances
          '''
          new = '''def _pairwise_distances(
              estimated: np.ndarray, reference: np.ndarray, distance_fn: DistanceFunction | None
          ) -> np.ndarray:
              if distance_fn is None:
                  differences = estimated[:, None, :] - reference[None, :, :]
                  scales = np.max(np.abs(differences), axis=-1)
                  distances = scales.copy()
                  finite_nonzero = np.isfinite(scales) & (scales > 0.0)
                  if np.any(finite_nonzero):
                      normalized = np.zeros_like(differences)
                      np.divide(
                          differences,
                          scales[..., None],
                          out=normalized,
                          where=finite_nonzero[..., None],
                      )
                      normalized_norms = np.linalg.norm(normalized, axis=-1)
                      distances[finite_nonzero] = (
                          scales[finite_nonzero] * normalized_norms[finite_nonzero]
                      )
                  distances[scales == 0.0] = 0.0
                  return distances
              distances = np.empty((estimated.shape[0], reference.shape[0]), dtype=float)
              for row, estimate in enumerate(estimated):
                  for col, truth in enumerate(reference):
                      distances[row, col] = float(distance_fn(estimate, truth))
              return distances
          '''
          if source.count(old) != 1:
              raise SystemExit("expected _pairwise_distances implementation not found exactly once")
          metrics_path.write_text(source.replace(old, new), encoding="utf-8")

          test_path = Path("tests/test_metrics_extreme_coordinates.py")
          test_path.write_text(
              '''import numpy as np

          from pyrecest.utils.metrics import gospa_distance, ospa_distance


          def _large_coordinate_case():
              component = 1.0e308
              estimated = np.array([[component, component]])
              reference = np.zeros((1, 2))
              expected = np.hypot(component, component)
              cutoff = 1.5e308
              return estimated, reference, expected, cutoff


          def test_ospa_preserves_representable_large_coordinate_distance():
              estimated, reference, expected, cutoff = _large_coordinate_case()

              with np.errstate(over="raise", invalid="raise"):
                  distance = ospa_distance(
                      estimated,
                      reference,
                      cutoff=cutoff,
                      order=1.0,
                  )

              assert np.isfinite(distance)
              np.testing.assert_allclose(
                  distance,
                  expected,
                  rtol=4.0 * np.finfo(float).eps,
                  atol=0.0,
              )


          def test_gospa_preserves_representable_large_coordinate_distance():
              estimated, reference, expected, cutoff = _large_coordinate_case()

              with np.errstate(over="raise", invalid="raise"):
                  distance = gospa_distance(
                      estimated,
                      reference,
                      cutoff=cutoff,
                      order=1.0,
                  )

              assert np.isfinite(distance)
              np.testing.assert_allclose(
                  distance,
                  expected,
                  rtol=4.0 * np.finfo(float).eps,
                  atol=0.0,
              )
          ''',
              encoding="utf-8",
          )

          Path(".github/workflows/one-shot-fix-metrics-extreme-norm.yml").unlink()
          PY

      - name: Validate syntax and numerical behavior
        shell: bash
        run: |
          python -m py_compile \
            src/pyrecest/utils/metrics.py \
            tests/test_metrics_extreme_coordinates.py
          python -m pip install --disable-pip-version-check --quiet numpy scipy shapely
          python - <<'PY'
          import importlib.util
          import sys
          import types
          from pathlib import Path

          import numpy as np

          pyrecest = types.ModuleType("pyrecest")
          pyrecest.__path__ = []
          backend = types.ModuleType("pyrecest.backend")
          backend.to_numpy = np.asarray
          sys.modules["pyrecest"] = pyrecest
          sys.modules["pyrecest.backend"] = backend

          path = Path("src/pyrecest/utils/metrics.py")
          spec = importlib.util.spec_from_file_location("metrics_under_test", path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          component = 1.0e308
          estimated = np.array([[component, component]])
          reference = np.zeros((1, 2))
          expected = np.hypot(component, component)
          cutoff = 1.5e308
          with np.errstate(over="raise", invalid="raise"):
              ospa = module.ospa_distance(estimated, reference, cutoff=cutoff)
              gospa = module.gospa_distance(estimated, reference, cutoff=cutoff)
          np.testing.assert_allclose(ospa, expected, rtol=4 * np.finfo(float).eps)
          np.testing.assert_allclose(gospa, expected, rtol=4 * np.finfo(float).eps)
          PY

      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pyrecest/utils/metrics.py \
            tests/test_metrics_extreme_coordinates.py \
            .github/workflows/one-shot-fix-metrics-extreme-norm.yml
          git commit -m "Fix overflow in point-set distance norms"
          git push origin HEAD:agent/fix-metrics-extreme-norm-20260731
