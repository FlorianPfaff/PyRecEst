name: Apply NaN HDP probability fix

on:
  push:
    branches:
      - agent/reject-nan-hdp-probabilities

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply source and regression patches
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/pyrecest/filters/multisensor_hdp_association.py")
          source = source_path.read_text(encoding="utf-8")
          old_guard = '''    if np.any((probabilities < 0.0) | (probabilities > 1.0)):
              raise ValueError(f"{name} must contain probabilities in [0, 1]")
          '''
          new_guard = '''    if (
              np.any(~np.isfinite(probabilities))
              or np.any(probabilities < 0.0)
              or np.any(probabilities > 1.0)
          ):
              raise ValueError(f"{name} must contain probabilities in [0, 1]")
          '''
          if source.count(old_guard) != 1:
              raise RuntimeError("Expected exactly one HDP probability guard")
          source_path.write_text(source.replace(old_guard, new_guard), encoding="utf-8")

          test_path = Path("tests/filters/test_multisensor_hdp_association.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = '\n\nif __name__ == "__main__":\n'
          regression = '''

              def test_nonfinite_probability_vectors_are_rejected(self):
                  invalid_probability_vectors = (
                      np.array([np.nan, 0.9]),
                      np.array([0.9, np.nan]),
                  )

                  for probabilities in invalid_probability_vectors:
                      with self.subTest(probabilities=probabilities):
                          with self.assertRaisesRegex(ValueError, "probabilities"):
                              multisensor_hdp_association(
                                  {"radar": np.zeros((1, 2))},
                                  global_target_weights=np.ones(2),
                                  detection_probabilities={"radar": probabilities},
                              )
                          with self.assertRaisesRegex(ValueError, "probabilities"):
                              predict_survival_weighted_hdp_masses(
                                  np.ones(2),
                                  probabilities,
                              )
          '''
          if marker not in tests:
              raise RuntimeError("Could not find unittest module footer")
          if "test_nonfinite_probability_vectors_are_rejected" in tests:
              raise RuntimeError("Regression test already exists")
          test_path.write_text(tests.replace(marker, regression + marker, 1), encoding="utf-8")
          PY

      - name: Validate focused behavior
        run: |
          python -m pip install --disable-pip-version-check numpy
          python -m py_compile \
            src/pyrecest/filters/multisensor_hdp_association.py \
            tests/filters/test_multisensor_hdp_association.py
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          import numpy as np

          path = Path("src/pyrecest/filters/multisensor_hdp_association.py")
          spec = importlib.util.spec_from_file_location("_hdp_validation", path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          np.testing.assert_allclose(
              module.predict_survival_weighted_hdp_masses(
                  np.array([2.0, 4.0]),
                  np.array([0.5, 0.25]),
              ),
              np.array([1.0, 1.0]),
          )

          for invalid in (np.array([np.nan, 0.9]), np.array([0.9, np.nan])):
              try:
                  module.predict_survival_weighted_hdp_masses(np.ones(2), invalid)
              except ValueError as exc:
                  assert "probabilities" in str(exc)
              else:
                  raise AssertionError("NaN survival probabilities were accepted")

              try:
                  module.multisensor_hdp_association(
                      {"radar": np.zeros((1, 2))},
                      global_target_weights=np.ones(2),
                      detection_probabilities={"radar": invalid},
                  )
              except ValueError as exc:
                  assert "probabilities" in str(exc)
              else:
                  raise AssertionError("NaN detection probabilities were accepted")
          PY

      - name: Commit patched files
        run: |
          rm .github/workflows/agent-fix-nan-hdp-probabilities.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pyrecest/filters/multisensor_hdp_association.py \
            tests/filters/test_multisensor_hdp_association.py \
            .github/workflows/agent-fix-nan-hdp-probabilities.yml
          git commit -m "Reject NaN HDP probability vectors"
          git push
