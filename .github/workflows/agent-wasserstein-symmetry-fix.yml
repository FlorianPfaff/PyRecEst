name: Apply Wasserstein covariance symmetry fix

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply source and regression changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          metrics_path = Path("src/pyrecest/utils/metrics.py")
          source = metrics_path.read_text(encoding="utf-8")

          helper_anchor = '''def _symmetrize(matrix: np.ndarray) -> np.ndarray:
              return 0.5 * (matrix + matrix.T)
          '''
          helper_replacement = '''def _validate_symmetric(matrix: np.ndarray, name: str) -> None:
              if not np.all(np.isfinite(matrix)):
                  raise ValueError(f"{name} must contain only finite values")
              transpose = matrix.T
              scale = np.maximum(np.maximum(np.abs(matrix), np.abs(transpose)), 1.0)
              with np.errstate(over="ignore", under="ignore", invalid="ignore"):
                  relative_asymmetry = np.abs(matrix / scale - transpose / scale)
              if np.any(relative_asymmetry > 1e-12):
                  raise ValueError(f"{name} must be symmetric")


          def _symmetrize(matrix: np.ndarray) -> np.ndarray:
              return 0.5 * (matrix + matrix.T)
          '''
          if "def _validate_symmetric(matrix: np.ndarray, name: str)" not in source:
              if helper_anchor not in source:
                  raise RuntimeError("Could not locate covariance symmetrization helper")
              source = source.replace(helper_anchor, helper_replacement, 1)

          covariance_anchor = '''def _as_covariance_matrix(value: ArrayLike, name: str) -> np.ndarray:
              matrix = _as_numeric_array(value, name)
              _validate_square_matrix(matrix, name)
              matrix = _symmetrize(matrix)
              _validate_positive_semidefinite(matrix, name)
              return matrix
          '''
          covariance_replacement = '''def _as_covariance_matrix(value: ArrayLike, name: str) -> np.ndarray:
              matrix = _as_numeric_array(value, name)
              _validate_square_matrix(matrix, name)
              _validate_symmetric(matrix, name)
              matrix = _symmetrize(matrix)
              _validate_positive_semidefinite(matrix, name)
              return matrix
          '''
          if "_validate_symmetric(matrix, name)" not in source:
              if covariance_anchor not in source:
                  raise RuntimeError("Could not locate covariance conversion helper")
              source = source.replace(covariance_anchor, covariance_replacement, 1)

          metrics_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_metrics_wasserstein_symmetry.py")
          test_path.write_text(
              '''import unittest

          import numpy as np
          from pyrecest.utils.metrics import (
              extent_wasserstein_distance,
              gaussian_wasserstein_distance,
          )


          class TestWassersteinCovarianceSymmetryValidation(unittest.TestCase):
              def test_gaussian_wasserstein_rejects_asymmetric_covariances(self):
                  mean = np.zeros(2)
                  valid = np.eye(2)
                  asymmetric = np.array([[1.0, 3.0], [-3.0, 1.0]])

                  with self.assertRaisesRegex(ValueError, "covariance1 must be symmetric"):
                      gaussian_wasserstein_distance(mean, asymmetric, mean, valid)
                  with self.assertRaisesRegex(ValueError, "covariance2 must be symmetric"):
                      gaussian_wasserstein_distance(mean, valid, mean, asymmetric)

              def test_extent_wasserstein_rejects_asymmetric_extents(self):
                  valid = np.eye(2)
                  asymmetric = np.array([[1.0, 3.0], [-3.0, 1.0]])

                  with self.assertRaisesRegex(ValueError, "estimated_extent must be symmetric"):
                      extent_wasserstein_distance(asymmetric, valid)
                  with self.assertRaisesRegex(ValueError, "reference_extent must be symmetric"):
                      extent_wasserstein_distance(valid, asymmetric)

              def test_roundoff_skew_remains_accepted(self):
                  mean = np.zeros(2)
                  valid = np.eye(2)
                  roundoff_skew = np.array([[1.0, 5e-13], [-5e-13, 1.0]])

                  self.assertEqual(
                      gaussian_wasserstein_distance(mean, roundoff_skew, mean, valid),
                      0.0,
                  )

              def test_extreme_asymmetry_raises_targeted_error_under_strict_numpy(self):
                  mean = np.zeros(2)
                  valid = np.eye(2)
                  max_float = np.finfo(np.float64).max
                  asymmetric = np.array([[1.0, max_float], [-max_float, 1.0]])

                  with np.errstate(all="raise"):
                      with self.assertRaisesRegex(ValueError, "covariance1 must be symmetric"):
                          gaussian_wasserstein_distance(mean, asymmetric, mean, valid)


          if __name__ == "__main__":
              unittest.main()
          ''',
              encoding="utf-8",
          )
          PY

      - name: Validate syntax
        run: |
          python -m py_compile \
            src/pyrecest/utils/metrics.py \
            tests/test_metrics_wasserstein_symmetry.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pyrecest/utils/metrics.py tests/test_metrics_wasserstein_symmetry.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Reject asymmetric Wasserstein covariances"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
