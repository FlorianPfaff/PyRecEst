name: Apply masked fractional power fix

on:
  push:
    branches:
      - agent/reject-masked-fractional-power-exponents-20260805

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reject-masked-fractional-power-exponents-20260805
          fetch-depth: 0

      - name: Apply implementation and regression patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/pyrecest/_backend/_shared_numpy/linalg.py"): (
                  '''def _normalize_fractional_matrix_power_exponent(t):
              """Return a finite, non-boolean real scalar exponent."""

              exponent_array = _onp.asarray(t)
          ''',
                  '''def _normalize_fractional_matrix_power_exponent(t):
              """Return a finite, non-boolean real scalar exponent."""

              if _onp.ma.is_masked(t):
                  raise TypeError("t must be a real scalar")

              exponent_array = _onp.asarray(t)
          ''',
              ),
              Path("src/pyrecest/_backend/pytorch/linalg.py"): (
                  '''def _normalize_fractional_matrix_power_exponent(t):
              """Return a finite, non-boolean real scalar exponent."""
              exponent_array = _as_numpy_no_grad(t)
          ''',
                  '''def _normalize_fractional_matrix_power_exponent(t):
              """Return a finite, non-boolean real scalar exponent."""
              if _np.ma.is_masked(t):
                  raise TypeError("t must be a real scalar")

              exponent_array = _as_numpy_no_grad(t)
          ''',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected source block not found in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          Path("tests/backend/test_fractional_matrix_power_masked_exponents.py").write_text(
              '''import numpy as np
          import pytest

          from pyrecest.backend import linalg


          @pytest.mark.parametrize(
              "exponent",
              (
                  np.ma.array(0.5, mask=True),
                  np.ma.masked,
              ),
          )
          def test_numpy_fractional_matrix_power_rejects_masked_exponent(exponent):
              with pytest.raises(TypeError, match="real scalar"):
                  linalg.fractional_matrix_power(np.eye(2), exponent)
          ''',
              encoding="utf-8",
          )

          Path(
              "tests/backend_support/test_pytorch_fractional_matrix_power_masked_exponents.py"
          ).write_text(
              '''import importlib.util

          import pytest
          from tests.support.backend_runner import run_backend_code


          @pytest.mark.backend_portable
          def test_pytorch_fractional_matrix_power_rejects_masked_exponents():
              if importlib.util.find_spec("torch") is None:
                  pytest.skip("PyTorch is not installed")

              result = run_backend_code(
                  "pytorch",
                  """
          import numpy as np
          from pyrecest.backend import linalg
          import pyrecest._backend.pytorch.linalg as raw_linalg

          matrix = [[4.0, 0.0], [0.0, 9.0]]
          for exponent in (np.ma.array(0.5, mask=True), np.ma.masked):
              for linalg_module in (linalg, raw_linalg):
                  try:
                      linalg_module.fractional_matrix_power(matrix, exponent)
                  except TypeError as exc:
                      assert "real scalar" in str(exc)
                  else:
                      raise AssertionError(
                          "fractional_matrix_power accepted masked exponent "
                          f"{exponent!r} via {linalg_module!r}"
                      )

          print("ok")
          """,
              )

              assert result.returncode == 0, result.stderr
              assert "ok" in result.stdout
          ''',
              encoding="utf-8",
          )
          PY

          rm .github/workflows/apply-masked-fractional-power-fix.yml

      - name: Validate focused regressions
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pytest \
            tests/backend/test_fractional_matrix_power_masked_exponents.py \
            tests/backend_support/test_pytorch_fractional_matrix_power_masked_exponents.py \
            -q
          python -m py_compile \
            src/pyrecest/_backend/_shared_numpy/linalg.py \
            src/pyrecest/_backend/pytorch/linalg.py \
            tests/backend/test_fractional_matrix_power_masked_exponents.py \
            tests/backend_support/test_pytorch_fractional_matrix_power_masked_exponents.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pyrecest/_backend/_shared_numpy/linalg.py \
            src/pyrecest/_backend/pytorch/linalg.py \
            tests/backend/test_fractional_matrix_power_masked_exponents.py \
            tests/backend_support/test_pytorch_fractional_matrix_power_masked_exponents.py \
            .github/workflows/apply-masked-fractional-power-fix.yml
          git commit -m "Reject masked fractional matrix power exponents"
          git push origin HEAD:agent/reject-masked-fractional-power-exponents-20260805
