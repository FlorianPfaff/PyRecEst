name: Apply adaptive process-noise mask fix

on:
  push:
    branches:
      - agent/reject-masked-adaptive-process-noise-controls-20260804
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'agent/reject-masked-adaptive-process-noise-controls-20260804' || github.ref_name == 'agent/reject-masked-adaptive-process-noise-controls-20260804'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reject-masked-adaptive-process-noise-controls-20260804
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Validate patch
        run: |
          python -m compileall -q src/pyrecest/filters/adaptive_process_noise.py tests/filters/test_adaptive_process_noise_masked_inputs.py
          python -m pytest -q tests/filters/test_adaptive_process_noise_masked_inputs.py tests/filters/test_adaptive_process_noise.py
          git diff --check

      - name: Remove temporary workflow
        run: |
          rm .github/workflows/apply-adaptive-process-noise-mask-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-adaptive-process-noise-mask-fix.yml
          git commit -m "Remove temporary adaptive mask workflow"
          git push
