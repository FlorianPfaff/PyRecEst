name: Apply time-offset stability patch

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/stabilize-time-offset-extreme-metrics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python tools/apply_time_offset_extreme_metrics_patch.py
      - name: Validate patch
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
          python -m pytest -q tests/calibration/test_time_offset_extreme_metrics.py
          python -m py_compile src/pyrecest/calibration/time_offset.py tests/calibration/test_time_offset_extreme_metrics.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize time-offset extreme metrics"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
