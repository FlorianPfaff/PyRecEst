name: Apply IMM positive-infinity fix

on:
  push:
    branches:
      - agent/reject-imm-positive-infinite-log-likelihoods
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/reject-imm-positive-infinite-log-likelihoods
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply focused fix and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/pyrecest/filters/interacting_multiple_model_filter.py')
          source = source_path.read_text(encoding='utf-8')
          error_text = 'log_likelihoods entries must not be positive infinity.'
          if error_text not in source:
              lines = source.splitlines()
              target = '                raise ValueError("log_likelihoods entries must not be NaN.")'
              try:
                  target_index = lines.index(target)
              except ValueError as exc:
                  raise SystemExit(
                      'Expected IMM NaN validation line was not found'
                  ) from exc
              if lines[target_index - 1] != (
                  '            if pyrecest.backend.any('
                  'pyrecest.backend.isnan(log_likelihoods)):'
              ):
                  raise SystemExit('Unexpected IMM validation context')
              lines[target_index + 1:target_index + 1] = [
                  '            if pyrecest.backend.any(',
                  '                log_likelihoods == float("inf")',
                  '            ):',
                  '                raise ValueError(',
                  f'                    "{error_text}"',
                  '                )',
              ]
              source_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          test_path = Path('tests/filters/test_imm_positive_infinite_log_likelihood.py')
          test_path.write_text('''import numpy as np
import numpy.testing as npt
import pytest

from pyrecest.distributions import GaussianDistribution
from pyrecest.filters import InteractingMultipleModelFilter


class _StaticGaussianFilter:
    def __init__(self, mean: float):
        self.filter_state = GaussianDistribution(
            np.array([mean]),
            np.array([[1.0]]),
            check_validity=False,
        )


def _make_imm() -> InteractingMultipleModelFilter:
    return InteractingMultipleModelFilter(
        [_StaticGaussianFilter(0.0), _StaticGaussianFilter(1.0)],
        transition_matrix=np.eye(2),
        mode_probabilities=np.array([0.4, 0.6]),
    )


def test_positive_infinite_log_likelihood_is_rejected_atomically():
    imm = _make_imm()
    imm.latest_model_likelihoods = np.array([0.25, 0.75])
    imm.latest_log_model_likelihoods = np.log(imm.latest_model_likelihoods)

    expected_probabilities = imm.mode_probabilities.copy()
    expected_likelihoods = imm.latest_model_likelihoods.copy()
    expected_log_likelihoods = imm.latest_log_model_likelihoods.copy()

    with pytest.raises(ValueError, match="positive infinity"):
        imm.update_mode_probabilities(
            log_likelihoods=np.array([float("inf"), 0.0])
        )

    npt.assert_array_equal(imm.mode_probabilities, expected_probabilities)
    npt.assert_array_equal(imm.latest_model_likelihoods, expected_likelihoods)
    npt.assert_array_equal(
        imm.latest_log_model_likelihoods,
        expected_log_likelihoods,
    )


def test_negative_infinite_log_likelihood_remains_zero_mass():
    imm = _make_imm()

    posterior = imm.update_mode_probabilities(
        log_likelihoods=np.array([-float("inf"), 0.0])
    )

    npt.assert_array_equal(posterior, np.array([0.0, 1.0]))
    npt.assert_array_equal(
        imm.latest_model_likelihoods,
        np.array([0.0, 1.0]),
    )
''', encoding='utf-8')
          PY

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run focused validation
        run: |
          python -m pytest tests/filters/test_imm_positive_infinite_log_likelihood.py -q
          python -m compileall -q \
            src/pyrecest/filters/interacting_multiple_model_filter.py \
            tests/filters/test_imm_positive_infinite_log_likelihood.py
          git diff --check

      - name: Commit validated patch
        shell: bash
        run: |
          rm .github/workflows/apply-imm-positive-infinity-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/pyrecest/filters/interacting_multiple_model_filter.py \
            tests/filters/test_imm_positive_infinite_log_likelihood.py \
            .github/workflows/apply-imm-positive-infinity-fix.yml
          git commit -m 'Reject positive-infinite IMM log likelihoods'
          git push origin HEAD:agent/reject-imm-positive-infinite-log-likelihoods
