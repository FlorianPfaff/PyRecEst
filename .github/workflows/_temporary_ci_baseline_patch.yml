name: Temporary CI baseline repair

on:
  push:
    branches:
      - chatgpt/fix-ci-baseline-20260818
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-ci-baseline-20260818
          fetch-depth: 0

      - name: Apply CI baseline repairs
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/fix_ci_baseline.py
          python /tmp/fix_ci_baseline.py

      - name: Validate patch syntax and whitespace
        shell: bash
        run: |
          python -m compileall -q src tests
          git diff --check

      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix broken cross-backend CI baseline"
          git push origin HEAD:chatgpt/fix-ci-baseline-20260818
