name: Apply complex Daum-Huang input fix

on:
  push:
    branches:
      - agent/reject-complex-daum-huang-inputs

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply focused source and regression-test patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/pyrecest/filters/daum_huang_particle_filter.py")
          source = source_path.read_text(encoding="utf-8")

          anchor = '''def _validate_flow_type(flow_type) -> FlowType:
          '''
          helper = '''def _as_real_array_np(value, name: str) -> np.ndarray:
              """Convert an array-like input without discarding imaginary components."""
              try:
                  values = np.asarray(to_numpy(value))
              except (TypeError, ValueError, RuntimeError, OverflowError) as exc:
                  raise ValueError(f"{name} must contain real numeric values.") from exc

              contains_complex_objects = values.dtype == object and any(
                  isinstance(item, (complex, np.complexfloating))
                  for item in values.reshape(-1)
              )
              if np.iscomplexobj(values) or contains_complex_objects:
                  raise ValueError(f"{name} must contain only real values.")

              try:
                  return np.asarray(values, dtype=float)
              except (TypeError, ValueError, RuntimeError, OverflowError) as exc:
                  raise ValueError(f"{name} must contain real numeric values.") from exc


          def _validate_flow_type(flow_type) -> FlowType:
          '''
          if anchor not in source:
              raise SystemExit("flow-type anchor not found")
          source = source.replace(anchor, helper, 1)

          replacements = {
              '    X = np.asarray(to_numpy(value), dtype=float)\n': '    X = _as_real_array_np(value, "particles")\n',
              '    weights = np.asarray(to_numpy(value), dtype=float).reshape(-1)\n': '    weights = _as_real_array_np(value, "weights").reshape(-1)\n',
              '    vector = np.asarray(to_numpy(value), dtype=float)\n': '    vector = _as_real_array_np(value, name)\n',
              '    matrix = np.asarray(to_numpy(value), dtype=float)\n': '    matrix = _as_real_array_np(value, name)\n',
              '    deltas = np.asarray(step_schedule, dtype=float).reshape(-1)\n': '    deltas = _as_real_array_np(step_schedule, "step_schedule").reshape(-1)\n',
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one occurrence of {old!r}, found {count}")
              source = source.replace(old, new, 1)

          measurement_block = '''    values = np.asarray(values, dtype=float)
              if values.ndim == 1 and X.shape[0] == 1:
          '''
          measurement_replacement = '''    values = _as_real_array_np(values, "measurement value")
              if values.ndim == 1 and X.shape[0] == 1:
          '''
          if source.count(measurement_block) != 1:
              raise SystemExit("batch-measurement conversion anchor not found exactly once")
          source = source.replace(measurement_block, measurement_replacement, 1)

          jacobian_block = '''    values = np.asarray(values, dtype=float)
              if values.ndim == 2 and X.shape[0] == 1:
          '''
          jacobian_replacement = '''    values = _as_real_array_np(values, "measurement jacobian")
              if values.ndim == 2 and X.shape[0] == 1:
          '''
          if source.count(jacobian_block) != 1:
              raise SystemExit("batch-jacobian conversion anchor not found exactly once")
          source = source.replace(jacobian_block, jacobian_replacement, 1)

          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/filters/test_daum_huang_particle_flow_real_inputs.py")
          test_path.write_text(
              '''"""Regression tests for real-valued Daum-Huang particle-flow inputs."""

          import numpy as np
          import pytest

          from pyrecest.backend import array
          from pyrecest.filters.daum_huang_particle_filter import (
              gaussian_bridge_moments,
              gaussian_particle_flow_update,
          )
          from pyrecest.models import LinearGaussianMeasurementModel


          @pytest.mark.parametrize(
              ("argument", "value", "message"),
              (
                  ("mean", array([1.0 + 2.0j]), "mean"),
                  ("covariance", array([[1.0 + 0.0j]]), "covariance"),
                  ("measurement_matrix", array([[1.0 + 2.0j]]), "measurement_matrix"),
                  ("measurement", array([1.0 + 2.0j]), "measurement"),
                  (
                      "measurement_noise_covariance",
                      array([[1.0 + 0.0j]]),
                      "measurement_noise_covariance",
                  ),
              ),
          )
          def test_gaussian_bridge_rejects_complex_public_inputs(argument, value, message):
              kwargs = {
                  "mean": array([0.0]),
                  "covariance": array([[1.0]]),
                  "measurement_matrix": array([[1.0]]),
                  "measurement": array([0.0]),
                  "measurement_noise_covariance": array([[1.0]]),
                  "delta_lambda": 1.0,
              }
              kwargs[argument] = value

              with pytest.raises(ValueError, match=rf"{message}.*real"):
                  gaussian_bridge_moments(**kwargs)


          @pytest.mark.parametrize(
              ("argument", "value", "message"),
              (
                  ("particles", array([[-1.0 + 2.0j], [1.0 + 0.0j]]), "particles"),
                  ("weights", array([0.5 + 0.0j, 0.5 + 1.0j]), "weights"),
                  (
                      "step_schedule",
                      array([0.5 + 1.0j, 0.5 + 0.0j]),
                      "step_schedule",
                  ),
              ),
          )
          def test_particle_flow_rejects_complex_state_and_control_inputs(
              argument, value, message
          ):
              model = LinearGaussianMeasurementModel(array([[1.0]]), array([[1.0]]))
              kwargs = {
                  "particles": array([[-1.0], [1.0]]),
                  "measurement_model": model,
                  "measurement": array([0.0]),
              }
              kwargs[argument] = value

              with pytest.raises(ValueError, match=rf"{message}.*real"):
                  gaussian_particle_flow_update(**kwargs)


          class _ComplexBatchMeasurementModel:
              noise_covariance = array([[1.0]])

              @staticmethod
              def h(states):
                  states = np.asarray(states)
                  return states[..., :1].astype(complex) + 1.0j

              @staticmethod
              def jacobian(states):
                  states = np.asarray(states)
                  return np.ones(states.shape[:-1] + (1, 1), dtype=float)


          def test_particle_flow_rejects_complex_vectorized_measurement_output():
              with pytest.raises(ValueError, match=r"measurement value.*real"):
                  gaussian_particle_flow_update(
                      array([[-1.0], [1.0]]),
                      _ComplexBatchMeasurementModel(),
                      array([0.0]),
                  )
          ''',
              encoding="utf-8",
          )
          PY

      - name: Install and run focused tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pytest -q \
            tests/filters/test_daum_huang_particle_flow_validation.py \
            tests/filters/test_daum_huang_particle_flow_real_inputs.py

      - name: Commit the validated fix
        shell: bash
        run: |
          rm .github/workflows/agent-fix-complex-daum-huang.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pyrecest/filters/daum_huang_particle_filter.py \
            tests/filters/test_daum_huang_particle_flow_real_inputs.py \
            .github/workflows/agent-fix-complex-daum-huang.yml
          git commit -m "Reject complex Daum-Huang flow inputs"
          git push origin HEAD:${{ github.ref_name }}
