name: Agent reject invalid discrete log likelihoods

on:
  push:
    branches:
      - agent/reject-invalid-discrete-log-likelihoods
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reject-invalid-discrete-log-likelihoods
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Apply regression fix
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/pyrecest/filters/discrete_state.py')
          source = source_path.read_text(encoding='utf-8')

          old_doc = '''        ``scaled[t, i] = exp(log_likelihood[t, i] - offsets[t])`` for finite
        emissions. Non-finite entries are returned as zero in ``scaled``.
'''
          new_doc = '''        ``scaled[t, i] = exp(log_likelihood[t, i] - offsets[t])`` for finite
        emissions. Negative-infinite entries are returned as zero in ``scaled``;
        NaN and positive-infinite entries are rejected.
'''
          if source.count(old_doc) != 1:
              raise RuntimeError('scaled_emissions docstring patch target changed')
          source = source.replace(old_doc, new_doc, 1)

          old_code = '''    finite = np.isfinite(values)
    if not np.all(np.any(finite, axis=1)):
'''
          new_code = '''    if np.any(np.isnan(values)) or np.any(np.isposinf(values)):
        raise ValueError(
            "log_likelihood must not contain NaN or positive infinity"
        )
    finite = np.isfinite(values)
    if not np.all(np.any(finite, axis=1)):
'''
          if source.count(old_code) != 1:
              raise RuntimeError('scaled_emissions implementation patch target changed')
          source = source.replace(old_code, new_code, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/filters/test_discrete_state_nonfinite_log_likelihoods.py')
          test_path.write_text('''"""Regression tests for invalid non-finite discrete log likelihoods."""\n\nimport numpy as np\nimport pytest\n\nfrom pyrecest.filters.discrete_state import (\n    discrete_forward_backward,\n    scaled_emissions,\n)\n\n\n@pytest.mark.parametrize("invalid_value", [np.nan, np.inf])\ndef test_scaled_emissions_rejects_invalid_nonfinite_values(invalid_value):\n    log_likelihood = np.array([[0.0, invalid_value]])\n\n    with pytest.raises(ValueError, match="NaN or positive infinity"):\n        scaled_emissions(log_likelihood)\n\n\ndef test_forward_backward_does_not_invert_positive_infinite_evidence():\n    log_likelihood = np.array([[np.inf, 0.0]])\n\n    with pytest.raises(ValueError, match="NaN or positive infinity"):\n        discrete_forward_backward(log_likelihood, np.eye(2))\n\n\ndef test_scaled_emissions_preserves_negative_infinity_as_zero_mass():\n    scaled, offsets = scaled_emissions(np.array([[0.0, -np.inf]]))\n\n    np.testing.assert_array_equal(scaled, np.array([[1.0, 0.0]]))\n    np.testing.assert_array_equal(offsets, np.array([0.0]))\n''', encoding='utf-8')

          Path('.github/workflows/agent-reject-invalid-discrete-log-likelihoods.yml').unlink()
          PY
      - name: Validate focused regression
        run: |
          python -m py_compile src/pyrecest/filters/discrete_state.py tests/filters/test_discrete_state_nonfinite_log_likelihoods.py
          python -m pytest tests/filters/test_discrete_state_nonfinite_log_likelihoods.py tests/filters/test_discrete_state.py -q
      - name: Commit final patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pyrecest/filters/discrete_state.py tests/filters/test_discrete_state_nonfinite_log_likelihoods.py .github/workflows/agent-reject-invalid-discrete-log-likelihoods.yml
          git commit -m 'Reject invalid discrete log likelihoods'
          git push origin HEAD:agent/reject-invalid-discrete-log-likelihoods
