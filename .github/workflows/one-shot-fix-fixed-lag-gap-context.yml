name: One-shot fixed-lag gap-context fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-fixed-lag-gap-transition-context-20260805

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply focused source and regression patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/pyrecest/filters/tracklet_viterbi.py")
          source = source_path.read_text(encoding="utf-8")

          prefix_start = source.index("        if prefix_added:\n")
          prefix_end = source.index(
              "        local = _solve_tracklet_viterbi(\n",
              prefix_start,
          )
          new_prefix = "\n".join(
              [
                  "        if prefix_added:",
                  "            if committed_miss_streak > 0:",
                  "                prefix_candidate = TrackletAssociationCandidate(",
                  "                    (\"__pyrecest_prefix_context__\", frame_index),",
                  "                    unary_cost=0.0,",
                  "                    time_s=start_time,",
                  "                )",
                  "                prefix_previous = None",
                  "            else:",
                  "                prefix_candidate = replace(previous_committed, unary_cost=0.0)",
                  "                prefix_previous = previous_committed",
                  "            window_frames.insert(0, [prefix_candidate])",
                  "            local_transition_cost = _transition_with_prefix_miss_streak(",
                  "                transition_cost,",
                  "                prefix_candidate,",
                  "                prefix_previous,",
                  "                committed_miss_streak,",
                  "                config,",
                  "            )",
                  "",
              ]
          )
          source = source[:prefix_start] + new_prefix + source[prefix_end:]

          function_start = source.index("def _fixed_lag_committed_step_cost(\n")
          cost_start = source.index(
              "    if previous_committed is None:\n",
              function_start,
          )
          cost_end = source.index(
              "\n\n\ndef _summarize_state_tables(\n",
              cost_start,
          )
          new_cost = "\n".join(
              [
                  "    if committed_miss_streak > 0:",
                  "        return float(",
                  "            unary_cost",
                  "            + transition(None, selected, committed_miss_streak)",
                  "        )",
                  "    if previous_committed is None:",
                  "        if selected is None:",
                  "            return float(unary_cost + config.missed_detection_cost)",
                  "        return float(unary_cost)",
                  "    return float(unary_cost + transition(previous_committed, selected, 0))",
              ]
          )
          source = source[:cost_start] + new_cost + source[cost_end:]
          source_path.write_text(source, encoding="utf-8")

          Path("tests/filters/test_tracklet_viterbi_gap_recovery.py").write_text(
              '''"""Regression coverage for fixed-lag transition context after a miss."""

          from pyrecest.filters.tracklet_viterbi import (
              TrackletAssociationCandidate,
              TrackletViterbiConfig,
              solve_fixed_lag_tracklet_viterbi,
              solve_tracklet_viterbi,
          )


          def test_fixed_lag_recovery_after_committed_gap_uses_missing_previous_context():
              first = TrackletAssociationCandidate("d0", track_id="A", time_s=0.0)
              recovered = TrackletAssociationCandidate("d2", track_id="B", time_s=2.0)
              frames = [[first], [], [recovered]]
              config = TrackletViterbiConfig(
                  missed_detection_cost=5.0,
                  consecutive_miss_cost=0.0,
              )

              def transition(previous, current, miss_streak):
                  if current is None:
                      return 1.0
                  if previous is None and miss_streak > 0:
                      return 0.0
                  if previous is not None and miss_streak > 0:
                      return 100.0
                  return 0.0

              full = solve_tracklet_viterbi(
                  frames,
                  config=config,
                  transition_cost=transition,
              )
              fixed_lag = solve_fixed_lag_tracklet_viterbi(
                  frames,
                  lag_s=0.1,
                  config=config,
                  transition_cost=transition,
              )

              assert full.path == [first, None, recovered]
              assert fixed_lag.path == full.path
              assert fixed_lag.total_cost == full.total_cost == 1.0
          ''',
              encoding="utf-8",
          )
          PY

      - name: Validate focused behavior
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check numpy
          python -m py_compile \
            src/pyrecest/filters/tracklet_viterbi.py \
            tests/filters/test_tracklet_viterbi_gap_recovery.py
          python - <<'PY'
          import importlib.util
          import sys

          module_name = "tracklet_viterbi_focused_check"
          spec = importlib.util.spec_from_file_location(
              module_name,
              "src/pyrecest/filters/tracklet_viterbi.py",
          )
          module = importlib.util.module_from_spec(spec)
          sys.modules[module_name] = module
          spec.loader.exec_module(module)

          Candidate = module.TrackletAssociationCandidate
          Config = module.TrackletViterbiConfig
          first = Candidate("d0", track_id="A", time_s=0.0)
          recovered = Candidate("d2", track_id="B", time_s=2.0)
          frames = [[first], [], [recovered]]

          def transition(previous, current, miss_streak):
              if current is None:
                  return 1.0
              if previous is None and miss_streak > 0:
                  return 0.0
              if previous is not None and miss_streak > 0:
                  return 100.0
              return 0.0

          config = Config(missed_detection_cost=5.0, consecutive_miss_cost=0.0)
          full = module.solve_tracklet_viterbi(
              frames, config=config, transition_cost=transition
          )
          fixed = module.solve_fixed_lag_tracklet_viterbi(
              frames, lag_s=0.1, config=config, transition_cost=transition
          )
          assert fixed.path == full.path == [first, None, recovered]
          assert fixed.total_cost == full.total_cost == 1.0
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-fix-fixed-lag-gap-context.yml
          git add src/pyrecest/filters/tracklet_viterbi.py \
            tests/filters/test_tracklet_viterbi_gap_recovery.py
          git commit -m "Fix fixed-lag transition context after misses"
          git push origin HEAD:agent/fix-fixed-lag-gap-transition-context-20260805
