name: Reject masked SO3 covariance regularization

on:
  push:
    branches:
      - agent/reject-masked-so3-covariance-regularization

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reject-masked-so3-covariance-regularization
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply focused fix and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/pyrecest/distributions/so3_conversion.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''def _validate_covariance_regularization(covariance_regularization):
              try:
                  regularization_array = np.asarray(covariance_regularization)
          '''
          new = '''def _validate_covariance_regularization(covariance_regularization):
              if np.ma.is_masked(covariance_regularization):
                  raise ValueError(_COVARIANCE_REGULARIZATION_ERROR)
              try:
                  regularization_array = np.asarray(covariance_regularization)
          '''
          if source.count(old) != 1:
              raise RuntimeError("expected covariance regularization validator exactly once")
          source_path.write_text(source.replace(old, new), encoding="utf-8")

          test_path = Path(
              "tests/distributions/test_so3_covariance_regularization_scalar_arrays.py"
          )
          tests = test_path.read_text(encoding="utf-8")
          addition = '''

          @pytest.mark.parametrize(
              "value",
              [np.ma.array(0.25, mask=True), np.ma.masked],
          )
          def test_covariance_regularization_rejects_masked_scalars(value):
              with pytest.raises(ValueError, match="covariance_regularization"):
                  _validate_covariance_regularization(value)


          def test_covariance_regularization_accepts_clear_mask_scalar_wrapper():
              value = np.ma.array(0.25, mask=False)

              assert _validate_covariance_regularization(value) == pytest.approx(0.25)
          '''
          marker = "def test_covariance_regularization_rejects_masked_scalars"
          if marker in tests:
              raise RuntimeError("masked covariance regression already exists")
          test_path.write_text(tests.rstrip() + addition + "\n", encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Run focused validation
        run: |
          python -m pytest -q tests/distributions/test_so3_covariance_regularization_scalar_arrays.py
          python -m compileall -q src/pyrecest/distributions/so3_conversion.py tests/distributions/test_so3_covariance_regularization_scalar_arrays.py
          git diff --check

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pyrecest/distributions/so3_conversion.py tests/distributions/test_so3_covariance_regularization_scalar_arrays.py
          git rm .github/workflows/agent-reject-masked-so3-covariance-regularization.yml
          git commit -m "Reject masked SO3 covariance regularization"
          git push origin HEAD:agent/reject-masked-so3-covariance-regularization
