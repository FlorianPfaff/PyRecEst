name: Apply Gaussian sampler zero-count fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/handle-zero-gaussian-samples

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Apply source fix and regression test
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source_path = Path("src/pyrecest/sampling/euclidean_sampler.py")
          source = source_path.read_text(encoding="utf-8")
          marker = "        return GaussianDistribution(zeros(dim), eye(dim)).sample(n_samples)\n"
          replacement = (
              "        if n_samples == 0:\n"
              "            return zeros((0, dim))\n"
              + marker
          )
          if replacement not in source:
              if source.count(marker) != 1:
                  raise RuntimeError("GaussianSampler return statement no longer has a unique match")
              source_path.write_text(source.replace(marker, replacement), encoding="utf-8")

          test_path = Path("tests/test_gaussian_sampler_zero_samples.py")
          test_path.write_text(
              dedent(
                  '''\
                  import numpy as np

                  from pyrecest.sampling.euclidean_sampler import GaussianSampler


                  def test_gaussian_sampler_zero_samples_returns_empty_matrix():
                      samples = GaussianSampler().sample_stochastic(0, 3)

                      assert samples.shape == (0, 3)
                      assert np.isfinite(np.asarray(samples)).all()
                  '''
              ),
              encoding="utf-8",
          )
          PY

      - name: Install package and run focused regression test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          PYTHONPATH=src python -m pytest -q tests/test_gaussian_sampler_zero_samples.py

      - name: Commit patch and remove one-shot files
        run: |
          rm -f .github/workflows/agent-handle-zero-gaussian-samples.yml .github/agent-handle-zero-gaussian-samples.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/pyrecest/sampling/euclidean_sampler.py tests/test_gaussian_sampler_zero_samples.py .github/workflows/agent-handle-zero-gaussian-samples.yml .github/agent-handle-zero-gaussian-samples.trigger
          git commit -m "Handle zero-sized Gaussian sample requests"
          git push origin HEAD:agent/handle-zero-gaussian-samples
