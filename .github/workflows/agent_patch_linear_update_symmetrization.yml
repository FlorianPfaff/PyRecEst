name: Agent patch linear update symmetrization

on:
  push:
    branches:
      - agent/stabilize-linear-update-symmetrization
  pull_request:
    branches:
      - main
\ npermissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply focused fix and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          implementation = Path("src/pyrecest/filters/linear_update_planning.py")
          source = implementation.read_text()
          old = "def _symmetrized(matrix: np.ndarray) -> np.ndarray:\n    return 0.5 * (matrix + matrix.T)\n"
          new = "def _symmetrized(matrix: np.ndarray) -> np.ndarray:\n    return 0.5 * matrix + 0.5 * matrix.T\n"
          if old not in source:
              raise SystemExit("Expected linear-update symmetrizer not found")
          implementation.write_text(source.replace(old, new, 1))

          tests = Path("tests/filters/test_linear_update_planning.py")
          test_source = tests.read_text()
          test_name = "test_plan_linear_measurement_update_avoids_symmetrization_overflow"
          if test_name not in test_source:
              test_source += '''\n\ndef test_plan_linear_measurement_update_avoids_symmetrization_overflow() -> None:\n    large_covariance = 0.75 * np.finfo(float).max\n\n    with np.errstate(over="raise", invalid="raise"):\n        plan = plan_linear_measurement_update(\n            mean=np.zeros(1),\n            covariance_matrix=np.array([[large_covariance]]),\n            measurement_vector=np.zeros(1),\n            measurement_covariance=np.zeros((1, 1)),\n            observation_matrix=np.ones((1, 1)),\n        )\n\n    assert plan.accepted is True\n    assert np.isfinite(plan.nominal_innovation_covariance).all()\n    assert plan.nominal_innovation_covariance[0, 0] == large_covariance\n'''
              tests.write_text(test_source)

          Path(".github/workflows/agent_patch_linear_update_symmetrization.yml").unlink()
          PY

      - name: Validate patch shape and numerical regression
        shell: bash
        run: |
          python -m py_compile \
            src/pyrecest/filters/linear_update_planning.py \
            tests/filters/test_linear_update_planning.py
          python - <<'PY'
          import numpy as np

          large = 0.75 * np.finfo(float).max
          matrix = np.array([[large]])
          try:
              with np.errstate(over="raise", invalid="raise"):
                  0.5 * (matrix + matrix.T)
          except FloatingPointError:
              pass
          else:
              raise SystemExit("Pre-fix expression unexpectedly stayed finite")

          with np.errstate(over="raise", invalid="raise"):
              repaired = 0.5 * matrix + 0.5 * matrix.T
          assert repaired[0, 0] == large
          assert np.isfinite(repaired).all()
          PY
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize linear-update covariance symmetrization"
          git push origin HEAD
