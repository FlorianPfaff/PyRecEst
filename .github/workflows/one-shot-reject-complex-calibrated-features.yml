name: Apply calibrated association feature validation fix

on:
  push:
    branches:
      - agent/reject-complex-calibrated-features

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reject-complex-calibrated-features
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply focused source and regression patch
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/pyrecest/utils/association_features.py')
          source = source_path.read_text(encoding='utf-8')
          old = '''def _flatten_prediction_features(features: Any) -> tuple[Any, tuple[int, ...]]:
              features = asarray(features, dtype=float64)
          '''
          new = '''def _flatten_prediction_features(features: Any) -> tuple[Any, tuple[int, ...]]:
              features = _as_real_numeric_backend_array(
                  features,
                  message="features must contain real numeric values",
              )
          '''
          if old not in source:
              raise SystemExit('Expected _flatten_prediction_features implementation not found')
          source_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/utils/test_calibrated_association_feature_validation.py')
          test_path.write_text(
              '''"""Regression tests for calibrated association feature validation."""

          import pytest

          from pyrecest.backend import array
          from pyrecest.utils import CalibratedPairwiseAssociationModel


          class _RecordingPredictProbaModel:
              classes_ = array([0, 1])

              def __init__(self):
                  self.called = False

              def predict_proba(self, features):
                  self.called = True
                  return array([[0.25, 0.75]])


          def test_predict_proba_rejects_complex_direct_features_before_model_call():
              model = _RecordingPredictProbaModel()
              calibrated_model = CalibratedPairwiseAssociationModel(
                  model,
                  feature_names=("distance", "similarity"),
              )
              complex_features = array([[1.0 + 2.0j, 0.5]])

              with pytest.raises(ValueError, match="real numeric"):
                  calibrated_model.predict_match_probability(complex_features)

              assert not model.called
          ''',
              encoding='utf-8',
          )

          Path('.github/workflows/one-shot-reject-complex-calibrated-features.yml').unlink()
          PY

      - name: Check changed Python syntax
        run: |
          python -m py_compile \
            src/pyrecest/utils/association_features.py \
            tests/utils/test_calibrated_association_feature_validation.py

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/pyrecest/utils/association_features.py \
            tests/utils/test_calibrated_association_feature_validation.py \
            .github/workflows/one-shot-reject-complex-calibrated-features.yml
          git commit -m "Reject complex calibrated association features"
          git push origin HEAD:agent/reject-complex-calibrated-features
