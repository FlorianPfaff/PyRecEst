name: Integrate and validate Cheap JPDAF

on:
  push:
    branches:
      - feature/cheap-jpdaf-20260915

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYRECEST_BACKEND: numpy
      BRANCH_NAME: feature/cheap-jpdaf-20260915
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/cheap-jpdaf-20260915
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and validation tools
        run: python -m pip install -e . pytest parameterized black isort pylint
      - name: Integrate shared solver and public API metadata
        run: python scripts/_integrate_cheap_jpdaf.py
      - name: Format changed Python files
        run: |
          python -m isort src/pyrecest/filters/cheap_joint_probabilistic_data_association_filter.py tests/filters/test_cheap_joint_probabilistic_data_association_filter.py
          python -m black src/pyrecest/filters/cheap_joint_probabilistic_data_association_filter.py src/pyrecest/filters/joint_probabilistic_data_association_filter.py tests/filters/test_cheap_joint_probabilistic_data_association_filter.py
      - name: Exact and cheap JPDAF regression tests
        run: |
          python -m pytest -q tests/filters/test_cheap_joint_probabilistic_data_association_filter.py tests/filters/test_joint_probabilistic_data_association_filter.py tests/filters/test_jpdaf_logdet_underflow.py
      - name: Validate API documentation and imports
        run: |
          python scripts/render_backend_api_matrix.py --check docs/backend-api-matrix.md
          python scripts/check_public_api_registry.py --check docs/public-api-registry.md
          python scripts/check_minimal_imports.py
          python -m pylint src/pyrecest/filters/cheap_joint_probabilistic_data_association_filter.py src/pyrecest/filters/joint_probabilistic_data_association_filter.py tests/filters/test_cheap_joint_probabilistic_data_association_filter.py
          python - <<'PY'
          import re
          from pathlib import Path
          example = re.search(r'```python\n(.*?)```', Path('docs/cheap-jpdaf.md').read_text(), re.S)
          exec(compile(example.group(1), 'docs/cheap-jpdaf.md', 'exec'))
          print('Cheap JPDAF documentation example passed')
          PY
      - name: Commit validated integration and remove bootstrap files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/implement-cheap-jpdaf.yml scripts/_integrate_cheap_jpdaf.py
          git add src/pyrecest/filters/cheap_joint_probabilistic_data_association_filter.py src/pyrecest/filters/joint_probabilistic_data_association_filter.py src/pyrecest/filters/__init__.py src/pyrecest/_backend/capabilities.py src/pyrecest/api_registry.py tests/filters/test_cheap_joint_probabilistic_data_association_filter.py docs/cheap-jpdaf.md docs/api-overview.md docs/backend-compatibility.md docs/backend-api-matrix.md docs/public-api-registry.md
          git diff --cached --stat
          git commit -m 'Integrate CheapJPDAF with shared Gaussian updates and API metadata'
          git push origin "HEAD:$BRANCH_NAME"
