name: Apply block particle weight normalization fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.ref == 'agent/stabilize-block-particle-weight-normalization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/stabilize-block-particle-weight-normalization

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply focused patch and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source_path = Path("src/pyrecest/filters/block_particle_filter.py")
          source = source_path.read_text(encoding="utf-8")
          old = dedent(
              """\
              @staticmethod
              def _normalize_weights(weights):
                  weights = array(weights, dtype=float)
                  if ndim(weights) != 1:
                      weights = reshape(weights, (-1,))
                  if not all(isfinite(weights)):
                      raise ValueError("Particle weights must be finite.")
                  if not all(weights >= 0.0):
                      raise ValueError("Particle weights must be nonnegative.")
                  weight_sum = sum(weights)
                  if weight_sum <= 0.0:
                      raise ValueError("At least one particle weight must be positive.")
                  return weights / weight_sum
              """
          )
          new = dedent(
              """\
              @staticmethod
              def _normalize_weights(weights):
                  weights = array(weights, dtype=float)
                  if ndim(weights) != 1:
                      weights = reshape(weights, (-1,))
                  if weights.shape[0] == 0:
                      raise ValueError("At least one particle weight must be positive.")
                  if not all(isfinite(weights)):
                      raise ValueError("Particle weights must be finite.")
                  if not all(weights >= 0.0):
                      raise ValueError("Particle weights must be nonnegative.")
                  weight_scale = max(weights)
                  if weight_scale <= 0.0:
                      raise ValueError("At least one particle weight must be positive.")
                  scaled_weights = weights / weight_scale
                  scaled_sum = sum(scaled_weights)
                  if not isfinite(scaled_sum) or scaled_sum <= 0.0:
                      raise ValueError("At least one particle weight must be positive.")
                  return scaled_weights / scaled_sum
              """
          )
          old = "    " + old.replace("\n", "\n    ").rstrip() + "\n"
          new = "    " + new.replace("\n", "\n    ").rstrip() + "\n"
          if source.count(old) != 1:
              raise RuntimeError("Expected exactly one block-particle normalization implementation")
          source_path.write_text(source.replace(old, new), encoding="utf-8")

          test_path = Path("tests/filters/test_block_particle_filter.py")
          tests = test_path.read_text(encoding="utf-8")
          import_old = "import numpy.testing as npt\n"
          import_new = "import numpy as np\nimport numpy.testing as npt\n"
          if tests.count(import_old) != 1:
              raise RuntimeError("Unexpected NumPy test import layout")
          tests = tests.replace(import_old, import_new, 1)
          backend_old = "from pyrecest.backend import array, ones\n"
          backend_new = "from pyrecest.backend import array, ones, to_numpy\n"
          if tests.count(backend_old) != 1:
              raise RuntimeError("Unexpected backend import layout")
          tests = tests.replace(backend_old, backend_new, 1)

          anchor = "    def test_rejects_nonfinite_weights(self):\n"
          regression = dedent(
              """\
              def test_normalizes_extreme_finite_weights_without_overflow(self):
                  backend_dtype = np.asarray(to_numpy(array([1.0]))).dtype
                  max_float = np.finfo(backend_dtype).max
                  filt = DummyBlockParticleFilter(
                      array([[0.0, 10.0], [1.0, 11.0]]),
                      partition="singleton",
                      weights=array([max_float, max_float / 2.0]),
                  )

                  expected = np.array([2.0 / 3.0, 1.0 / 3.0])
                  npt.assert_allclose(to_numpy(filt.weights), expected)
                  npt.assert_allclose(
                      to_numpy(filt.block_weights), np.tile(expected, (2, 1))
                  )

              """
          )
          regression = "    " + regression.replace("\n", "\n    ").rstrip() + "\n\n"
          if tests.count(anchor) != 1:
              raise RuntimeError("Unexpected regression insertion point")
          test_path.write_text(tests.replace(anchor, regression + anchor, 1), encoding="utf-8")
          PY

      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest

      - name: Run focused regression suite
        run: |
          python -m pytest tests/filters/test_block_particle_filter.py -q
          python -m compileall -q src/pyrecest/filters/block_particle_filter.py tests/filters/test_block_particle_filter.py
          git diff --check

      - name: Commit tested patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/agent-stabilize-block-particle-weight-normalization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pyrecest/filters/block_particle_filter.py tests/filters/test_block_particle_filter.py .github/workflows/agent-stabilize-block-particle-weight-normalization.yml
          git commit -m "Stabilize block particle weight normalization"
          git push origin HEAD
