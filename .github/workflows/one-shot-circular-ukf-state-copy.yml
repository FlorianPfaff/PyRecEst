name: One-shot CircularUKF state ownership patch

on:
  push:
    branches:
      - agent/circular-ukf-state-copy
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/circular-ukf-state-copy

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Apply focused fix and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/pyrecest/filters/circular_ukf.py")
          source = source_path.read_text()
          old = '''    @filter_state.setter
              def filter_state(self, new_state):
                  new_state = _as_circular_gaussian(new_state, "filter_state")
                  self._filter_state = new_state
          '''.replace("              ", "")
          new = '''    @filter_state.setter
              def filter_state(self, new_state):
                  new_state = _as_circular_gaussian(new_state, "filter_state")
                  AbstractFilter.filter_state.fset(self, new_state)
          '''.replace("              ", "")
          if source.count(old) != 1:
              raise RuntimeError("expected exactly one CircularUKF state setter")
          source_path.write_text(source.replace(old, new))

          test_path = Path("tests/filters/test_circular_ukf_state_ownership.py")
          test_path.write_text(
              '''import unittest

import numpy.testing as npt

import pyrecest.backend
from pyrecest.backend import array
from pyrecest.distributions import GaussianDistribution
from pyrecest.filters.circular_ukf import CircularUKF


class CircularUKFStateOwnershipTest(unittest.TestCase):
    @unittest.skipUnless(
        pyrecest.backend.__backend_name__ == "numpy",
        "mutable NumPy arrays required for aliasing regression",
    )
    def test_assignment_copies_state(self):
        filt = CircularUKF()
        assigned = GaussianDistribution(array([0.5]), array([[0.7]]))
        filt.filter_state = assigned

        self.assertIsNot(filt.filter_state, assigned)
        assigned.mu[0] = 1.5
        assigned.C[0, 0] = 2.0

        npt.assert_equal(filt.filter_state.mu, array([0.5]))
        npt.assert_equal(filt.filter_state.C, array([[0.7]]))


if __name__ == "__main__":
    unittest.main()
'''
          )

          Path(
              ".github/workflows/one-shot-circular-ukf-state-copy.yml"
          ).unlink()
          PY

      - name: Validate changed Python syntax
        run: |
          python -m compileall -q \
            src/pyrecest/filters/circular_ukf.py \
            tests/filters/test_circular_ukf_state_ownership.py
          git diff --check

      - name: Commit focused patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prevent CircularUKF state aliasing"
          git push
