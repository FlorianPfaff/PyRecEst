name: One-shot fix IMM weight normalization

on:
  push:
    branches:
      - agent/fix-imm-weight-normalization-20260730
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event_name == 'push' || github.head_ref == 'agent/fix-imm-weight-normalization-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fix-imm-weight-normalization-20260730

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply focused IMM normalization fix
        run: python .github/scripts/apply_imm_normalization_fix.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest black

      - name: Format and run focused tests
        run: |
          python -m black src/pyrecest/filters/interacting_multiple_model_filter.py tests/filters/test_imm_extreme_weight_normalization.py
          python -m pytest -q \
            tests/filters/test_imm_extreme_weight_normalization.py \
            tests/filters/test_interacting_multiple_model_filter.py \
            tests/filters/test_imm_complex_input_validation.py

      - name: Commit tested patch and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-imm-weight-normalization.yml .github/scripts/apply_imm_normalization_fix.py
          git add src/pyrecest/filters/interacting_multiple_model_filter.py tests/filters/test_imm_extreme_weight_normalization.py
          git commit -m "Fix IMM weight normalization overflow"
          git push origin HEAD:agent/fix-imm-weight-normalization-20260730
