name: Apply no-op track split fix

on:
  push:
    branches:
      - agent/reject-noop-track-splits
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply focused patch and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/pyrecest/utils/track_edit_whatif.py")
          source = source_path.read_text(encoding="utf-8")
          old = (
              "    left = output[row_index].copy()\n"
              "    right = output[row_index].copy()\n"
              "    left[split_session:] = None\n"
              "    right[:split_session] = None\n"
              "    pieces = [row for index, row in enumerate(output) if index != row_index]\n"
              "    if any(value is not None for value in left):\n"
              "        pieces.append(left)\n"
              "    if any(value is not None for value in right):\n"
              "        pieces.append(right)\n"
          )
          new = (
              "    left = output[row_index].copy()\n"
              "    right = output[row_index].copy()\n"
              "    left[split_session:] = None\n"
              "    right[:split_session] = None\n"
              "    left_has_observation = any(value is not None for value in left)\n"
              "    right_has_observation = any(value is not None for value in right)\n"
              "    if not left_has_observation or not right_has_observation:\n"
              "        return TrackEditApplication(\n"
              "            edit,\n"
              "            output,\n"
              "            False,\n"
              "            \"reject\",\n"
              "            \"split_does_not_partition_track\",\n"
              "        )\n"
              "    pieces = [row for index, row in enumerate(output) if index != row_index]\n"
              "    pieces.append(left)\n"
              "    pieces.append(right)\n"
          )
          if old not in source:
              raise SystemExit("expected split_track implementation block not found")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_track_edit_whatif.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_split_track_rejects_boundary_with_empty_side()"
          if marker not in tests:
              tests += '''


def test_split_track_rejects_boundary_with_empty_side() -> None:
    cases = (
        ([[None, 7, 8]], 1),
        ([[7, 8, None]], 2),
    )

    for predicted, split_session in cases:
        edit = TrackEdit(
            kind="split_track",
            track_index=0,
            session_b=split_session,
        )

        application = apply_track_edit(predicted, edit)

        assert not application.applied
        assert application.action == "reject"
        assert application.reason == "split_does_not_partition_track"
        assert application.track_matrix.tolist() == predicted


def test_split_track_partitions_observations_on_both_sides() -> None:
    predicted = [[1, 2, 3]]
    edit = TrackEdit(kind="split_track", track_index=0, session_b=2)

    application = apply_track_edit(predicted, edit)

    assert application.applied
    assert application.action == "split_track"
    assert application.track_matrix.tolist() == [
        [1, 2, None],
        [None, None, 3],
    ]
'''
              test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/pyrecest/utils/track_edit_whatif.py \
            tests/test_track_edit_whatif.py
          git diff --check
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pytest tests/test_track_edit_whatif.py -q

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-reject-noop-track-splits.yml
          git add src/pyrecest/utils/track_edit_whatif.py tests/test_track_edit_whatif.py
          git commit -m "Reject no-op track splits"
          git push origin HEAD:agent/reject-noop-track-splits
