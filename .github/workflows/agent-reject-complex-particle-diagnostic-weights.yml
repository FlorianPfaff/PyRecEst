name: Apply complex particle diagnostic weight fix

on:
  push:
    branches:
      - agent/reject-complex-particle-diagnostic-weights

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reject-complex-particle-diagnostic-weights
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/pyrecest/diagnostics.py")
          source = source_path.read_text(encoding="utf-8")
          old_declaration = (
              "_WEIGHT_TEXT_OR_BOOL_TYPES = (bool, np.bool_, str, bytes, bytearray)"
          )
          new_declaration = """_INVALID_WEIGHT_SCALAR_TYPES = (
              bool,
              np.bool_,
              str,
              bytes,
              bytearray,
              complex,
              np.complexfloating,
          )"""
          if source.count(old_declaration) != 1:
              raise SystemExit("Unexpected particle-weight type declaration")
          source = source.replace(old_declaration, new_declaration)
          expected_references = source.count("_WEIGHT_TEXT_OR_BOOL_TYPES")
          if expected_references != 3:
              raise SystemExit(
                  f"Expected 3 particle-weight type references, found {expected_references}"
              )
          source = source.replace(
              "_WEIGHT_TEXT_OR_BOOL_TYPES", "_INVALID_WEIGHT_SCALAR_TYPES"
          )
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_diagnostics.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_particle_diagnostics_rejects_complex_weights():"
          if marker in tests:
              raise SystemExit("Complex particle-weight regression already exists")
          tests += """


def test_particle_diagnostics_rejects_complex_weights():
    invalid_cases = (
        1.0 + 2.0j,
        np.complex64(1.0 + 2.0j),
        np.complex128(1.0 + 0.0j),
        [np.complex64(1.0 + 2.0j), 1.0],
        np.array([1.0 + 2.0j, 1.0], dtype=np.complex64),
        np.array([np.complex64(1.0 + 2.0j), 1.0], dtype=object),
    )
    for weights in invalid_cases:
        with pytest.raises(ValueError, match="Particle weights must be numeric"):
            ParticleDiagnostics.from_weights(weights)


def test_particle_diagnostics_accepts_real_numpy_scalar_weights():
    diagnostics = ParticleDiagnostics.from_weights(
        [np.float32(1.0), np.float64(3.0)]
    )

    assert isclose(diagnostics.effective_sample_size, 1.6)
"""
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest

      - name: Run focused regression tests
        run: python -m pytest -q tests/test_diagnostics.py

      - name: Check syntax and whitespace
        run: |
          python -m compileall -q src/pyrecest/diagnostics.py tests/test_diagnostics.py
          git diff --check

      - name: Commit tested patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/agent-reject-complex-particle-diagnostic-weights.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pyrecest/diagnostics.py tests/test_diagnostics.py .github/workflows/agent-reject-complex-particle-diagnostic-weights.yml
          git commit -m "Reject complex particle diagnostic weights"
          git push origin HEAD:agent/reject-complex-particle-diagnostic-weights
