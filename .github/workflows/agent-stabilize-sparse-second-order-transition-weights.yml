name: Stabilize sparse second-order transition weights

on:
  push:
    branches:
      - agent/stabilize-sparse-second-order-transition-weights

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-sparse-second-order-transition-weights
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply focused fix and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/pyrecest/filters/sparse_second_order_grid.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''            total = float(weights.sum())
            if total <= 0.0:
                raise ValueError("transition row must contain positive mass")
            if not np.isclose(total, 1.0):
                weights = weights / total
'''
          new = '''            if weights.size == 0:
                raise ValueError("transition row must contain positive mass")
            maximum_weight = float(np.max(weights))
            if maximum_weight <= 0.0:
                raise ValueError("transition row must contain positive mass")
            scaled_weights = weights / maximum_weight
            scaled_total = float(scaled_weights.sum())
            if scaled_total <= 0.0 or not np.isfinite(scaled_total):
                raise ValueError("transition row must contain positive finite mass")
            weights = scaled_weights / scaled_total
'''
          if source.count(old) != 1:
              raise RuntimeError("expected transition normalization block exactly once")
          source_path.write_text(source.replace(old, new), encoding="utf-8")

          test_path = Path("tests/test_sparse_second_order_grid_extreme_transition_weights.py")
          test_path.write_text(
              '''import numpy as np

from pyrecest.filters.sparse_second_order_grid import (
    sparse_second_order_grid_evidence,
)


def test_extreme_finite_transition_weights_preserve_relative_mass():
    maximum = np.finfo(float).max

    def initial_pair_initializer(_scaled_emissions):
        return (
            np.array([0]),
            np.array([0]),
            np.array([1.0]),
            np.array([1]),
        )

    def transition_row_builder(_previous, _current, _transition_index):
        return np.array([0, 1]), np.array([maximum, maximum / 2.0])

    with np.errstate(over="raise", invalid="raise", divide="raise"):
        result = sparse_second_order_grid_evidence(
            np.zeros((3, 2)),
            initial_pair_initializer,
            transition_row_builder,
            return_smoothed=False,
        )

    np.testing.assert_allclose(
        np.exp(result.terminal_log_probabilities),
        np.array([2.0 / 3.0, 1.0 / 3.0]),
        rtol=1e-14,
        atol=0.0,
    )
''',
              encoding="utf-8",
          )
          PY

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .

      - name: Run focused validation
        run: |
          python -m pytest -q tests/test_sparse_second_order_grid_extreme_transition_weights.py
          python -m compileall -q src/pyrecest/filters/sparse_second_order_grid.py tests/test_sparse_second_order_grid_extreme_transition_weights.py
          git diff --check

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pyrecest/filters/sparse_second_order_grid.py tests/test_sparse_second_order_grid_extreme_transition_weights.py
          git rm .github/workflows/agent-stabilize-sparse-second-order-transition-weights.yml
          git commit -m "Stabilize sparse second-order transition weights"
          git push origin HEAD:agent/stabilize-sparse-second-order-transition-weights
