name: Apply stable residual norm fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-unaddressed-bug-20260805
          fetch-depth: 0

      - name: Apply implementation and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          planning = Path("src/pyrecest/filters/linear_update_planning.py")
          text = planning.read_text()
          constants = (
              'ROBUST_UPDATE_MODES = ("nis-inflate", "student-t", "huber")\n'
              'DEFAULT_STUDENT_T_DOF = 4.0\n'
              'DEFAULT_HUBER_THRESHOLD = 2.0\n'
          )
          helper = constants + '''


def _stable_euclidean_norm(values: np.ndarray) -> float:
    """Return a scale-stable Euclidean norm for finite real values."""

    flattened = np.abs(np.asarray(values, dtype=float)).reshape(-1)
    return float(np.hypot.reduce(flattened, initial=0.0))
'''
          if constants not in text:
              raise SystemExit("linear-update constants anchor not found")
          text = text.replace(constants, helper, 1)
          old_norm = "    residual_norm = float(np.linalg.norm(residual))\n"
          if old_norm not in text:
              raise SystemExit("linear-update residual norm anchor not found")
          text = text.replace(
              old_norm,
              "    residual_norm = _stable_euclidean_norm(residual)\n",
              1,
          )
          planning.write_text(text)

          diagnostics = Path("src/pyrecest/tracking/innovation_diagnostics.py")
          text = diagnostics.read_text()
          imports = '''from pyrecest.filters.linear_update_planning import (
    chi_square_gate_threshold,
    normalized_innovation_squared,
)
'''
          helper = imports + '''


def _stable_euclidean_norm(values: np.ndarray) -> float:
    """Return a scale-stable Euclidean norm for finite real values."""

    flattened = np.abs(np.asarray(values, dtype=float)).reshape(-1)
    return float(np.hypot.reduce(flattened, initial=0.0))
'''
          if imports not in text:
              raise SystemExit("innovation-diagnostic import anchor not found")
          text = text.replace(imports, helper, 1)
          old_norm = "        residual_norm=float(np.linalg.norm(residual_array)),\n"
          if old_norm not in text:
              raise SystemExit("innovation-diagnostic residual norm anchor not found")
          text = text.replace(
              old_norm,
              "        residual_norm=_stable_euclidean_norm(residual_array),\n",
              1,
          )
          diagnostics.write_text(text)

          planning_test = Path("tests/filters/test_linear_update_planning.py")
          text = planning_test.read_text().rstrip()
          test_name = "test_plan_linear_measurement_update_uses_scale_stable_residual_norm"
          if test_name not in text:
              text += '''


def test_plan_linear_measurement_update_uses_scale_stable_residual_norm() -> None:
    residual = np.array([1.0e200, 1.0e200])

    with np.errstate(over="raise", invalid="raise"):
        plan = plan_linear_measurement_update(
            mean=np.zeros(2),
            covariance_matrix=np.zeros((2, 2)),
            measurement_vector=residual,
            measurement_covariance=np.eye(2) * 1.0e200,
            observation_matrix=np.eye(2),
            max_residual_norm=1.5e200,
        )

    assert plan.accepted is True
    assert plan.action == "updated"
    assert np.isclose(plan.residual_norm, np.sqrt(2.0) * 1.0e200)
'''
          planning_test.write_text(text + "\n")

          diagnostics_test = Path("tests/tracking/test_innovation_diagnostics.py")
          text = diagnostics_test.read_text().rstrip()
          test_name = "test_innovation_diagnostic_uses_scale_stable_residual_norm"
          if test_name not in text:
              text += '''


def test_innovation_diagnostic_uses_scale_stable_residual_norm() -> None:
    residual = np.array([1.0e200, 1.0e200])

    with np.errstate(over="raise", invalid="raise"):
        diagnostic = innovation_diagnostic(
            residual,
            np.eye(2) * 1.0e200,
            gate_threshold=3.0e200,
        )

    assert diagnostic.accepted is True
    assert np.isclose(diagnostic.residual_norm, np.sqrt(2.0) * 1.0e200)
'''
          diagnostics_test.write_text(text + "\n")
          PY

      - name: Validate focused regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q "numpy>=2,<2.5" "scipy>=1.14,<1.18" "pytest>=8,<10"
          PYTHONPATH=src:. python -m pytest -q \
            tests/filters/test_linear_update*.py \
            tests/tracking/test_innovation*.py
          python -m py_compile \
            src/pyrecest/filters/linear_update_planning.py \
            src/pyrecest/tracking/innovation_diagnostics.py \
            tests/filters/test_linear_update_planning.py \
            tests/tracking/test_innovation_diagnostics.py
          git diff --check

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pyrecest/filters/linear_update_planning.py \
            src/pyrecest/tracking/innovation_diagnostics.py \
            tests/filters/test_linear_update_planning.py \
            tests/tracking/test_innovation_diagnostics.py
          git commit -m "Stabilize residual norm calculations"
          git push origin HEAD:agent/audit-unaddressed-bug-20260805
