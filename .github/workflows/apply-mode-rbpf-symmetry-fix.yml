name: Apply Mode-RBPF covariance symmetrization fix

on:
  push:
    branches:
      - agent/stabilize-mode-rbpf-covariance-symmetrization-20260805
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-mode-rbpf-covariance-symmetrization-20260805
          fetch-depth: 0

      - name: Apply source and regression patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/pyrecest/filters/mode_rbpf_manifold_ukf_tracker.py")
          source = source_path.read_text(encoding="utf-8")
          replacements = [
              (
                  "        return 0.5 * (matrix + matrix.T)\n",
                  "        return 0.5 * matrix + 0.5 * matrix.T\n",
              ),
              (
                  "        covariance = 0.5 * (covariance + covariance.T)\n",
                  "        covariance = self._symmetrize(covariance)\n",
              ),
              (
                  "        return 0.5 * (stabilized + stabilized.T)\n",
                  "        return self._symmetrize(stabilized)\n",
              ),
              (
                  "        covariance = 0.5 * (\n"
                  "            np.asarray(covariance, dtype=float) + np.asarray(covariance, dtype=float).T\n"
                  "        )\n",
                  "        covariance = ModeRBPFManifoldUKFTracker._symmetrize(covariance)\n",
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one source occurrence, found {count}: {old!r}"
                  )
              source = source.replace(old, new, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path(
              "tests/filters/test_mode_rbpf_covariance_symmetrization.py"
          )
          test_path.write_text(
              '''"""Regression tests for overflow-safe Mode-RBPF covariance symmetrization."""

import unittest

import numpy as np
import numpy.testing as npt
import pyrecest.backend as pyrecest_backend
from pyrecest.filters import ModeRBPFManifoldUKFTracker


@unittest.skipIf(
    pyrecest_backend.__backend_name__ != "numpy",
    reason="ModeRBPFManifoldUKFTracker is currently NumPy-backend only",
)
class TestModeRBPFCovarianceSymmetrization(unittest.TestCase):
    def setUp(self):
        self.covariance = np.diag([1.0e308, 2.0e307])

    def test_extreme_covariance_validation_does_not_overflow(self):
        with np.errstate(over="raise", invalid="raise"):
            validated = ModeRBPFManifoldUKFTracker._as_covariance(
                self.covariance,
                2,
                "covariance",
            )

        npt.assert_allclose(validated, self.covariance, rtol=0.0, atol=0.0)
        self.assertTrue(np.all(np.isfinite(validated)))

    def test_stabilization_and_logpdf_do_not_overflow(self):
        tracker = object.__new__(ModeRBPFManifoldUKFTracker)
        tracker.minimum_covariance_eigenvalue = 0.0

        with np.errstate(over="raise", invalid="raise", divide="raise"):
            stabilized = tracker._stabilize_covariance(
                self.covariance,
                floor=0.0,
            )
            log_pdf = tracker._gaussian_logpdf(
                np.zeros(2),
                self.covariance,
            )

        npt.assert_allclose(stabilized, self.covariance, rtol=1.0e-15, atol=0.0)
        self.assertTrue(np.all(np.isfinite(stabilized)))
        self.assertTrue(np.isfinite(log_pdf))


if __name__ == "__main__":
    unittest.main()
''',
              encoding="utf-8",
          )
          PY

      - name: Install package and validate focused regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
          python -m py_compile \
            src/pyrecest/filters/mode_rbpf_manifold_ukf_tracker.py \
            tests/filters/test_mode_rbpf_covariance_symmetrization.py
          python -m pytest -q \
            tests/filters/test_mode_rbpf_covariance_symmetrization.py
          git diff --check

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-mode-rbpf-symmetry-fix.yml
          git add \
            src/pyrecest/filters/mode_rbpf_manifold_ukf_tracker.py \
            tests/filters/test_mode_rbpf_covariance_symmetrization.py
          git commit -m "Stabilize Mode-RBPF covariance symmetrization"
          git push origin HEAD:agent/stabilize-mode-rbpf-covariance-symmetrization-20260805
