name: Apply linear-update covariance fix

on:
  push:
    branches:
      - agent/reject-invalid-linear-update-covariances-20260804
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reject-invalid-linear-update-covariances-20260804
          clean: true

      - name: Apply source fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path("src/pyrecest/filters/linear_update_planning.py")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  dedent('''\
                      if innovation_covariance.shape != (residual.size, residual.size):
                          raise ValueError(
                              "innovation_covariance must have shape (residual_dim, residual_dim)"
                          )
                      if _normalized_innovation_squared is not None:
                  '''),
                  dedent('''\
                      if innovation_covariance.shape != (residual.size, residual.size):
                          raise ValueError(
                              "innovation_covariance must have shape (residual_dim, residual_dim)"
                          )
                      innovation_covariance = _validate_covariance_matrix(
                          innovation_covariance,
                          "innovation_covariance",
                          require_positive_definite=True,
                      )
                      if _normalized_innovation_squared is not None:
                  '''),
              ),
              (
                  dedent('''\
                      if covariance.shape != (measurement_dim, measurement_dim):
                          raise ValueError(
                              "measurement_covariance must have shape (measurement_dim, measurement_dim)"
                          )

                      resolved_gate_threshold = _resolve_threshold(
                  '''),
                  dedent('''\
                      if covariance.shape != (measurement_dim, measurement_dim):
                          raise ValueError(
                              "measurement_covariance must have shape (measurement_dim, measurement_dim)"
                          )

                      state_covariance = _validate_covariance_matrix(
                          state_covariance,
                          "covariance_matrix",
                      )
                      covariance = _validate_covariance_matrix(
                          covariance,
                          "measurement_covariance",
                      )

                      resolved_gate_threshold = _resolve_threshold(
                  '''),
              ),
              (
                  dedent('''\
                  def _symmetrized(matrix: np.ndarray) -> np.ndarray:
                      return 0.5 * (matrix + matrix.T)


                  def _contains_values_of_type(value: Any, types: tuple[type, ...]) -> bool:
                  '''),
                  dedent('''\
                  def _symmetrized(matrix: np.ndarray) -> np.ndarray:
                      return 0.5 * (matrix + matrix.T)


                  def _validate_covariance_matrix(
                      matrix: np.ndarray,
                      name: str,
                      *,
                      require_positive_definite: bool = False,
                  ) -> np.ndarray:
                      qualifier = (
                          "symmetric positive definite"
                          if require_positive_definite
                          else "symmetric positive semidefinite"
                      )
                      if not np.allclose(matrix, matrix.T, rtol=0.0, atol=1.0e-10):
                          raise ValueError(f"{name} must be {qualifier}")

                      symmetric = _symmetrized(matrix)
                      if symmetric.shape[0] == 0:
                          return symmetric

                      if require_positive_definite:
                          try:
                              np.linalg.cholesky(symmetric)
                          except np.linalg.LinAlgError as exc:
                              raise ValueError(f"{name} must be {qualifier}") from exc
                          return symmetric

                      try:
                          eigenvalues = np.linalg.eigvalsh(symmetric)
                      except np.linalg.LinAlgError as exc:
                          raise ValueError(f"{name} must be {qualifier}") from exc
                      scale = max(1.0, float(np.max(np.abs(eigenvalues))))
                      if float(np.min(eigenvalues)) < -1.0e-10 * scale:
                          raise ValueError(f"{name} must be {qualifier}")
                      return symmetric


                  def _contains_values_of_type(value: Any, types: tuple[type, ...]) -> bool:
                  '''),
              ),
          ]

          for old, new in replacements:
              if source.count(old) != 1:
                  raise RuntimeError("linear-update patch anchor changed")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Add regression tests
        shell: bash
        run: |
          cat > tests/filters/test_linear_update_covariance_validation.py <<'PY'
          import numpy as np
          import pytest
          from pyrecest.filters.linear_update_planning import (
              normalized_innovation_squared,
              plan_linear_measurement_update,
          )


          def test_normalized_innovation_squared_rejects_nonpositive_definite_covariance():
              invalid_covariances = (
                  np.array([[-1.0]]),
                  np.zeros((1, 1)),
                  np.array([[1.0, 0.5], [0.0, 1.0]]),
              )
              for covariance in invalid_covariances:
                  with pytest.raises(
                      ValueError,
                      match="innovation_covariance must be symmetric positive definite",
                  ):
                      normalized_innovation_squared(
                          np.ones(covariance.shape[0]), covariance
                      )


          @pytest.mark.parametrize(
              ("field", "invalid_covariance"),
              [
                  ("covariance_matrix", np.array([[-2.0]])),
                  ("measurement_covariance", np.array([[-2.0]])),
              ],
          )
          def test_plan_rejects_indefinite_component_covariances(
              field, invalid_covariance
          ):
              kwargs = {
                  "mean": np.zeros(1),
                  "covariance_matrix": np.eye(1),
                  "measurement_vector": np.ones(1),
                  "measurement_covariance": np.eye(1),
                  "observation_matrix": np.eye(1),
                  "gate_threshold": 1.0,
              }
              kwargs[field] = invalid_covariance
              with pytest.raises(
                  ValueError,
                  match=rf"{field} must be symmetric positive semidefinite",
              ):
                  plan_linear_measurement_update(**kwargs)


          def test_plan_accepts_semidefinite_component_covariance_when_innovation_is_pd():
              plan = plan_linear_measurement_update(
                  mean=np.zeros(1),
                  covariance_matrix=np.zeros((1, 1)),
                  measurement_vector=np.ones(1),
                  measurement_covariance=np.eye(1),
                  observation_matrix=np.eye(1),
              )
              assert plan.accepted
              assert np.isclose(plan.nis, 1.0)
          PY

      - name: Validate
        shell: bash
        run: |
          python -m py_compile \
            src/pyrecest/filters/linear_update_planning.py \
            tests/filters/test_linear_update_covariance_validation.py
          python -m pytest -q tests/filters/test_linear_update_planning.py \
            tests/filters/test_linear_update_covariance_validation.py

      - name: Commit final patch
        shell: bash
        run: |
          rm .github/workflows/agent-linear-update-covariance-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/pyrecest/filters/linear_update_planning.py \
            tests/filters/test_linear_update_covariance_validation.py \
            .github/workflows/agent-linear-update-covariance-fix.yml
          git commit -m 'Reject invalid linear update covariances'
          git push origin HEAD:agent/reject-invalid-linear-update-covariances-20260804
