name: Apply Euclidean MTT distance fix

on:
  push:
    branches:
      - agent/stabilize-euclidean-mtt-distance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-euclidean-mtt-distance

      - name: Apply implementation and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/pyrecest/evaluation/get_distance_function.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''def _euclidean_mtt_distance(x1, x2, *, cutoff_distance: float) -> float:
              first, second = _compatible_target_matrices(x1, x2)
              if first.shape[0] == 0 or second.shape[0] == 0:
                  return float(cutoff_distance * abs(first.shape[0] - second.shape[0]))

              deltas = first[:, None, :] - second[None, :, :]
              costs = numpy.linalg.norm(deltas, axis=2)
              costs = numpy.minimum(costs, float(cutoff_distance))
              row_indices, column_indices = linear_sum_assignment(costs)
              matched_cost = float(costs[row_indices, column_indices].sum())
              missed_count = abs(first.shape[0] - second.shape[0])
              return matched_cost + float(cutoff_distance) * missed_count
          '''
          new = '''def _capped_pairwise_euclidean_distances(
              first: numpy.ndarray,
              second: numpy.ndarray,
              cutoff_distance: float,
          ) -> numpy.ndarray:
              """Return pairwise Euclidean distances capped without overflow."""
              if cutoff_distance == 0.0:
                  return numpy.zeros((first.shape[0], second.shape[0]), dtype=float)

              first_values = first[:, None, :]
              second_values = second[None, :, :]
              pairwise_shape = (first.shape[0], second.shape[0], first.shape[1])
              same_sign = numpy.signbit(first_values) == numpy.signbit(second_values)
              normalized_differences = numpy.ones(pairwise_shape, dtype=float)

              same_sign_difference = numpy.zeros(pairwise_shape, dtype=float)
              numpy.subtract(
                  first_values,
                  second_values,
                  out=same_sign_difference,
                  where=same_sign,
              )
              absolute_difference = numpy.abs(same_sign_difference)
              same_sign_below_cutoff = same_sign & (
                  absolute_difference < cutoff_distance
              )
              numpy.divide(
                  absolute_difference,
                  cutoff_distance,
                  out=normalized_differences,
                  where=same_sign_below_cutoff,
              )

              absolute_first = numpy.abs(first_values)
              absolute_second = numpy.abs(second_values)
              opposite_sign_below_cutoff = (
                  ~same_sign
                  & (absolute_first < cutoff_distance)
                  & (absolute_second < cutoff_distance)
              )
              first_scaled = numpy.zeros(pairwise_shape, dtype=float)
              second_scaled = numpy.zeros(pairwise_shape, dtype=float)
              numpy.divide(
                  absolute_first,
                  cutoff_distance,
                  out=first_scaled,
                  where=opposite_sign_below_cutoff,
              )
              numpy.divide(
                  absolute_second,
                  cutoff_distance,
                  out=second_scaled,
                  where=opposite_sign_below_cutoff,
              )
              opposite_sign_difference = numpy.minimum(
                  first_scaled + second_scaled,
                  1.0,
              )
              numpy.copyto(
                  normalized_differences,
                  opposite_sign_difference,
                  where=opposite_sign_below_cutoff,
              )

              normalized_distances = numpy.linalg.norm(
                  normalized_differences,
                  axis=2,
              )
              return cutoff_distance * numpy.minimum(normalized_distances, 1.0)


          def _euclidean_mtt_distance(x1, x2, *, cutoff_distance: float) -> float:
              first, second = _compatible_target_matrices(x1, x2)
              if first.shape[0] == 0 or second.shape[0] == 0:
                  return float(cutoff_distance * abs(first.shape[0] - second.shape[0]))

              costs = _capped_pairwise_euclidean_distances(
                  first,
                  second,
                  cutoff_distance,
              )
              row_indices, column_indices = linear_sum_assignment(costs)
              matched_cost = float(costs[row_indices, column_indices].sum())
              missed_count = abs(first.shape[0] - second.shape[0])
              return matched_cost + float(cutoff_distance) * missed_count
          '''
          if source.count(old) != 1:
              raise RuntimeError("Expected exactly one Euclidean MTT implementation block")
          source_path.write_text(source.replace(old, new), encoding="utf-8")

          test_path = Path(
              "tests/evaluation/test_euclidean_mtt_extreme_coordinates.py"
          )
          test_path.write_text(
              '''"""Regression tests for overflow-safe Euclidean MTT distances."""

          import unittest

          import numpy as np
          import numpy.testing as npt

          from pyrecest.evaluation.get_distance_function import get_distance_function


          class EuclideanMttExtremeCoordinatesTest(unittest.TestCase):
              def test_opposite_extreme_coordinates_are_capped_without_overflow(self):
                  max_float = np.finfo(float).max
                  distance = get_distance_function(
                      "euclidean_mtt",
                      {"cutoff_distance": 7.0},
                  )

                  with np.errstate(over="raise", invalid="raise", divide="raise"):
                      result = distance(
                          np.array([[-max_float]]),
                          np.array([[max_float]]),
                      )

                  self.assertEqual(result, 7.0)

              def test_large_subcutoff_norm_preserves_distance(self):
                  max_float = np.finfo(float).max
                  distance = get_distance_function(
                      "euclidean_mtt",
                      {"cutoff_distance": max_float},
                  )

                  with np.errstate(over="raise", invalid="raise", divide="raise"):
                      result = distance(
                          np.array([[max_float / 2.0, max_float / 2.0]]),
                          np.array([[0.0, 0.0]]),
                      )

                  npt.assert_allclose(
                      result,
                      max_float / np.sqrt(2.0),
                      rtol=1e-15,
                      atol=0.0,
                  )


          if __name__ == "__main__":
              unittest.main()
          ''',
              encoding="utf-8",
          )

          Path(".github/workflows/apply-euclidean-mtt-distance-fix.yml").unlink()
          PY

      - name: Validate generated changes
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/pyrecest/evaluation/get_distance_function.py \
            tests/evaluation/test_euclidean_mtt_extreme_coordinates.py
          git diff --check

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/pyrecest/evaluation/get_distance_function.py \
            tests/evaluation/test_euclidean_mtt_extreme_coordinates.py \
            .github/workflows/apply-euclidean-mtt-distance-fix.yml
          git commit -m "Stabilize Euclidean MTT distance costs"
          git push origin HEAD:agent/stabilize-euclidean-mtt-distance
