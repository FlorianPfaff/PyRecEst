name: Apply sparse transition stability fix

on:
  push:
    branches:
      - agent/fix-sparse-gaussian-transition-overflow-20260731

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused patch
        run: python scripts/apply_sparse_transition_stability_fix.py
      - name: Validate syntax and focused regression
        run: |
          python -m py_compile src/pyrecest/filters/discrete_state.py tests/filters/test_discrete_state_grid_validation.py
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/filters/test_discrete_state_grid_validation.py
      - name: Commit patch and remove one-shot files
        run: |
          rm .github/workflows/apply-sparse-transition-stability-fix.yml
          rm scripts/apply_sparse_transition_stability_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pyrecest/filters/discrete_state.py tests/filters/test_discrete_state_grid_validation.py .github/workflows/apply-sparse-transition-stability-fix.yml scripts/apply_sparse_transition_stability_fix.py
          git commit -m "Stabilize sparse Gaussian transition distances"
          git push origin HEAD:${{ github.ref_name }}
