name: Apply masked mixture-weight validation fix

on:
  push:
    branches:
      - agent/reject-masked-mixture-weights-20260730

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Apply validation fix and add regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/pyrecest/distributions/abstract_mixture.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''def _validate_mixture_weight_values(weights) -> None:
              """Reject invalid mixture weights before backend scalar comparisons."""
              try:
          '''
          new = '''def _validate_mixture_weight_values(weights) -> None:
              """Reject invalid mixture weights before backend scalar comparisons."""
              if np.ma.is_masked(weights):
                  raise ValueError("Mixture weights must not contain masked values")
              try:
          '''
          if old not in source:
              raise SystemExit("Expected mixture-weight validation block was not found")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/distributions/test_mixture_masked_weights.py")
          test_path.write_text(
              '''"""Regression tests for masked mixture weights."""

          import numpy as np
          import pytest

          from pyrecest.backend import array, to_numpy
          from pyrecest.distributions.nonperiodic.gaussian_distribution import (
              GaussianDistribution,
          )
          from pyrecest.distributions.nonperiodic.gaussian_mixture import GaussianMixture


          def _components():
              return [
                  GaussianDistribution(array([0.0]), array([[1.0]])),
                  GaussianDistribution(array([1.0]), array([[1.0]])),
              ]


          @pytest.mark.parametrize(
              "weights",
              [
                  np.ma.masked,
                  np.ma.array([0.25, 0.75], mask=[False, True]),
              ],
          )
          def test_mixture_rejects_masked_weights(weights):
              with pytest.raises(ValueError, match="masked"):
                  GaussianMixture(_components(), weights)


          def test_unmasked_masked_array_weights_remain_supported():
              mixture = GaussianMixture(
                  _components(), np.ma.array([0.25, 0.75], mask=False)
              )

              np.testing.assert_allclose(to_numpy(mixture.w), [0.25, 0.75])
          ''',
              encoding="utf-8",
          )
          PY

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run focused regression suite
        env:
          PYRECEST_BACKEND: numpy
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest -q \
            tests/distributions/test_mixture_masked_weights.py \
            tests/distributions/test_gaussian_mixture_constructor.py \
            tests/distributions/test_linear_mixture.py \
            tests/distributions/test_mixture_weight_overflow.py

      - name: Commit validated fix and remove one-shot workflow
        run: |
          rm .github/workflows/agent-reject-masked-mixture-weights.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pyrecest/distributions/abstract_mixture.py \
            tests/distributions/test_mixture_masked_weights.py \
            .github/workflows/agent-reject-masked-mixture-weights.yml
          git commit -m "Reject masked mixture weights"
          git push origin HEAD
