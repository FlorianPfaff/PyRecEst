name: Apply track completion masked-input fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply focused patch and regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/pyrecest/utils/track_completion.py")
          source = source_path.read_text(encoding="utf-8")
          replacements = {
              "def _coerce_candidate_session(value: Any) -> int | None:\n    try:\n        value_array = np.asarray(value)\n":
                  "def _coerce_candidate_session(value: Any) -> int | None:\n    if np.ma.is_masked(value):\n        return None\n    try:\n        value_array = np.asarray(value)\n",
              "def _normalize_candidate_observation(value: Any) -> int:\n    value_array = np.asarray(value)\n":
                  "def _normalize_candidate_observation(value: Any) -> int:\n    if np.ma.is_masked(value):\n        raise ValueError(\"candidate observations must be non-negative integers\")\n    value_array = np.asarray(value)\n",
              "def _as_finite_score(value: Any, name: str) -> float:\n    message = f\"{name} must be a finite real scalar\"\n    value_array = np.asarray(value)\n":
                  "def _as_finite_score(value: Any, name: str) -> float:\n    message = f\"{name} must be a finite real scalar\"\n    if np.ma.is_masked(value):\n        raise ValueError(message)\n    value_array = np.asarray(value)\n",
              "def _as_positive_int(value: Any, name: str) -> int:\n    value_array = np.asarray(value)\n    message = f\"{name} must be a positive integer\"\n":
                  "def _as_positive_int(value: Any, name: str) -> int:\n    message = f\"{name} must be a positive integer\"\n    if np.ma.is_masked(value):\n        raise ValueError(message)\n    value_array = np.asarray(value)\n",
              "def _as_bool_flag(value: Any, name: str) -> bool:\n    value_array = np.asarray(value)\n    message = f\"{name} must be a boolean\"\n":
                  "def _as_bool_flag(value: Any, name: str) -> bool:\n    message = f\"{name} must be a boolean\"\n    if np.ma.is_masked(value):\n        raise ValueError(message)\n    value_array = np.asarray(value)\n",
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one exact source match, found {count}: {old!r}")
              source = source.replace(old, new, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_track_completion_masked_validation.py")
          test_path.write_text(
              '''"""Regression tests for masked track-completion inputs."""

          from __future__ import annotations

          import unittest

          import numpy as np
          from pyrecest.utils.track_completion import (
              CompletionCandidate,
              enumerate_fragment_completion_paths,
          )


          class TestTrackCompletionMaskedValidation(unittest.TestCase):
              tracks = [[0, None]]

              @staticmethod
              def provider(session: int, observation: int, target_session: int):
                  del session, observation, target_session
                  return [1]

              def test_rejects_masked_public_controls(self) -> None:
                  invalid_calls = (
                      (
                          "max_path_length",
                          {"max_path_length": np.ma.array(2, mask=True)},
                          "positive integer",
                      ),
                      (
                          "max_paths_per_fragment",
                          {"max_paths_per_fragment": np.ma.array(1, mask=True)},
                          "positive integer",
                      ),
                      (
                          "allow_duplicate_source",
                          {"allow_duplicate_source": np.ma.array(True, mask=True)},
                          "must be a boolean",
                      ),
                      (
                          "allow_duplicate_target",
                          {"allow_duplicate_target": np.ma.array(True, mask=True)},
                          "must be a boolean",
                      ),
                  )
                  for label, kwargs, message in invalid_calls:
                      with self.subTest(label=label):
                          with self.assertRaisesRegex(ValueError, message):
                              enumerate_fragment_completion_paths(
                                  self.tracks,
                                  direction="suffix",
                                  candidate_provider=self.provider,
                                  **kwargs,
                              )

              def test_rejects_masked_candidate_observations_and_scores(self) -> None:
                  invalid_candidates = (
                      np.ma.array(1, mask=True),
                      CompletionCandidate(np.ma.array(1, mask=True)),
                  )
                  for candidate in invalid_candidates:
                      with self.subTest(candidate=repr(candidate)):
                          with self.assertRaisesRegex(ValueError, "candidate observations"):
                              enumerate_fragment_completion_paths(
                                  self.tracks,
                                  direction="suffix",
                                  candidate_provider=lambda *_args, value=candidate: [value],
                              )

                  with self.assertRaisesRegex(ValueError, "candidate scores"):
                      enumerate_fragment_completion_paths(
                          self.tracks,
                          direction="suffix",
                          candidate_provider=lambda *_args: [
                              CompletionCandidate(1, score=np.ma.array(0.25, mask=True))
                          ],
                      )

                  with self.assertRaisesRegex(ValueError, "path scores"):
                      enumerate_fragment_completion_paths(
                          self.tracks,
                          direction="suffix",
                          candidate_provider=self.provider,
                          score_path=lambda _steps: np.ma.array(0.5, mask=True),
                      )

              def test_ignores_masked_candidate_sessions(self) -> None:
                  paths = enumerate_fragment_completion_paths(
                      [[7, None, None]],
                      direction="suffix",
                      candidate_provider=lambda *_args: [9],
                      candidate_session_provider=lambda *_args: [
                          np.ma.array(2, mask=True)
                      ],
                  )
                  self.assertEqual(paths, [])

              def test_accepts_fully_unmasked_masked_scalar_wrappers(self) -> None:
                  paths = enumerate_fragment_completion_paths(
                      self.tracks,
                      max_path_length=np.ma.array(1, mask=False),
                      direction="suffix",
                      candidate_provider=lambda *_args: [
                          CompletionCandidate(
                              np.ma.array(1, mask=False),
                              score=np.ma.array(0.25, mask=False),
                          )
                      ],
                      candidate_session_provider=lambda *_args: [
                          np.ma.array(1, mask=False)
                      ],
                      allow_duplicate_source=np.ma.array(False, mask=False),
                      allow_duplicate_target=np.ma.array(False, mask=False),
                      max_paths_per_fragment=np.ma.array(1, mask=False),
                  )
                  self.assertEqual(len(paths), 1)
                  self.assertEqual(paths[0].end_observation, 1)
                  self.assertEqual(paths[0].score, 0.25)


          if __name__ == "__main__":
              unittest.main()
          '''.replace("          ", ""),
              encoding="utf-8",
          )

          workflow_path = Path(
              ".github/workflows/apply-track-completion-masked-input-fix.yml"
          )
          workflow_path.unlink()
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Validate focused regression
        run: |
          python -m py_compile \
            src/pyrecest/utils/track_completion.py \
            tests/test_track_completion_masked_validation.py
          python -m pytest -q \
            tests/test_track_completion.py \
            tests/test_track_completion_temporal_validation.py \
            tests/test_track_completion_scalar_session_arrays.py \
            tests/test_track_completion_masked_validation.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pyrecest/utils/track_completion.py \
            tests/test_track_completion_masked_validation.py \
            .github/workflows/apply-track-completion-masked-input-fix.yml
          git commit -m "Reject masked track completion inputs"
          git push
