name: Apply DP birth control atomicity fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'agent/fix-dp-birth-control-atomicity' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply embedded patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/fix-dp-birth-control-atomicity.yml').read_text()
          match = re.search(r"echo '([^']+)' \| base64 --decode", workflow)
          if match is None:
              raise RuntimeError('embedded patch payload not found')
          Path('/tmp/apply_patch.py').write_bytes(base64.b64decode(match.group(1)))
          PY
          python /tmp/apply_patch.py

      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest autopep8

      - name: Format changed Python files
        run: |
          python -m autopep8 --in-place --aggressive --aggressive --aggressive \
            src/pyrecest/filters/dirichlet_process_birth_tracker.py \
            tests/filters/test_dirichlet_process_birth_tracker.py

      - name: Run focused regression tests
        run: python -m pytest tests/filters/test_dirichlet_process_birth_tracker.py -q

      - name: Check formatting and syntax
        run: |
          python -m compileall -q src/pyrecest/filters/dirichlet_process_birth_tracker.py tests/filters/test_dirichlet_process_birth_tracker.py
          git diff --check

      - name: Commit patch and remove one-shot workflows
        shell: bash
        run: |
          rm .github/workflows/fix-dp-birth-control-atomicity.yml
          rm .github/workflows/apply-dp-birth-control-atomicity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pyrecest/filters/dirichlet_process_birth_tracker.py tests/filters/test_dirichlet_process_birth_tracker.py .github/workflows/fix-dp-birth-control-atomicity.yml .github/workflows/apply-dp-birth-control-atomicity.yml
          git commit -m "Make DP birth control failures atomic"
          git push origin HEAD:${{ github.head_ref }}
