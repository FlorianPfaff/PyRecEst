name: Agent harden particle-flow validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/harden-gaussian-particle-flow-validation-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install focused test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Apply focused validation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/pyrecest/filters/daum_huang_particle_filter.py")
          source = source_path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match, found {count}: {old[:80]!r}")
              return text.replace(old, new, 1)

          source = replace_once(
              source,
              """        self.step_schedule = (\n            None\n            if step_schedule is None\n            else tuple(float(value) for value in step_schedule)\n        )\n""",
              """        self.step_schedule = (\n            None if step_schedule is None else tuple(step_schedule)\n        )\n""",
          )

          source = replace_once(
              source,
              """LEDHParticleFlowFilter = LocalizedDaumHuangParticleFlowFilter\n\n\ndef _validate_flow_type(flow_type) -> FlowType:\n""",
              """LEDHParticleFlowFilter = LocalizedDaumHuangParticleFlowFilter\n\n\ndef _contains_masked_value(value) -> bool:\n    if np.ma.is_masked(value):\n        return True\n    if isinstance(value, np.ndarray):\n        if value.dtype != object:\n            return False\n        return any(_contains_masked_value(item) for item in value.reshape(-1))\n    if isinstance(value, (list, tuple)):\n        return any(_contains_masked_value(item) for item in value)\n    return False\n\n\ndef _validate_flow_type(flow_type) -> FlowType:\n""",
          )

          source = replace_once(
              source,
              """def _validate_positive_int(value, name: str) -> int:\n    message = f\"{name} must be a positive integer.\"\n    value_array = np.asarray(value)\n""",
              """def _validate_positive_int(value, name: str) -> int:\n    message = f\"{name} must be a positive integer.\"\n    if _contains_masked_value(value):\n        raise ValueError(message)\n    value_array = np.asarray(value)\n""",
          )

          source = replace_once(
              source,
              """def _validate_nonnegative_float(value, name: str) -> float:\n    message = f\"{name} must be finite and nonnegative.\"\n    value_array = np.asarray(value)\n""",
              """def _validate_nonnegative_float(value, name: str) -> float:\n    message = f\"{name} must be finite and nonnegative.\"\n    if _contains_masked_value(value):\n        raise ValueError(message)\n    value_array = np.asarray(value)\n""",
          )

          source = replace_once(
              source,
              """def _as_particle_matrix_np(value):\n    X = np.asarray(to_numpy(value), dtype=float)\n""",
              """def _as_particle_matrix_np(value):\n    if _contains_masked_value(value):\n        raise ValueError(\"particles must not contain masked values.\")\n    X = np.asarray(to_numpy(value), dtype=float)\n""",
          )

          source = replace_once(
              source,
              """def _as_weights_np(value, n_particles: int):\n    weights = np.asarray(to_numpy(value), dtype=float).reshape(-1)\n""",
              """def _as_weights_np(value, n_particles: int):\n    if _contains_masked_value(value):\n        raise ValueError(\"weights must not contain masked values.\")\n    weights = np.asarray(to_numpy(value), dtype=float).reshape(-1)\n""",
          )

          source = replace_once(
              source,
              """def _as_vector_np(value, name):\n    vector = np.asarray(to_numpy(value), dtype=float)\n""",
              """def _as_vector_np(value, name):\n    if _contains_masked_value(value):\n        raise ValueError(f\"{name} must not contain masked values.\")\n    vector = np.asarray(to_numpy(value), dtype=float)\n""",
          )

          source = replace_once(
              source,
              """def _as_matrix_np(value, name, *, scalar_dim: int | None = None):\n    matrix = np.asarray(to_numpy(value), dtype=float)\n""",
              """def _as_matrix_np(value, name, *, scalar_dim: int | None = None):\n    if _contains_masked_value(value):\n        raise ValueError(f\"{name} must not contain masked values.\")\n    matrix = np.asarray(to_numpy(value), dtype=float)\n""",
          )

          source = replace_once(
              source,
              """def _lambda_deltas_np(n_steps, step_schedule):\n    if step_schedule is None:\n        n_steps = _validate_positive_int(n_steps, \"n_steps\")\n        return np.full(n_steps, 1.0 / float(n_steps))\n    deltas = np.asarray(step_schedule, dtype=float).reshape(-1)\n""",
              """def _lambda_deltas_np(n_steps, step_schedule):\n    if step_schedule is None:\n        n_steps = _validate_positive_int(n_steps, \"n_steps\")\n        return np.full(n_steps, 1.0 / float(n_steps))\n    if _contains_masked_value(step_schedule):\n        raise ValueError(\"step_schedule must not contain masked values.\")\n    deltas = np.asarray(step_schedule, dtype=float).reshape(-1)\n""",
          )

          source = replace_once(
              source,
              """def _regularize_cov_np(covariance, jitter):\n    covariance = _symmetrize_np(np.asarray(covariance, dtype=float))\n    if covariance.ndim != 2 or covariance.shape[0] != covariance.shape[1]:\n        raise ValueError(\"covariance must be square.\")\n    if jitter > 0.0:\n        scale = max(float(np.trace(covariance) / max(covariance.shape[0], 1)), 1.0)\n        covariance = covariance + float(jitter) * scale * np.eye(covariance.shape[0])\n    sign = np.linalg.slogdet(covariance)[0]\n    if sign <= 0.0:\n        scale = max(float(np.trace(covariance) / max(covariance.shape[0], 1)), 1.0)\n        covariance = covariance + max(float(jitter), 1e-10) * scale * np.eye(\n            covariance.shape[0]\n        )\n    return _symmetrize_np(covariance)\n""",
              """def _regularize_cov_np(covariance, jitter):\n    covariance = _symmetrize_np(np.asarray(covariance, dtype=float))\n    if covariance.ndim != 2 or covariance.shape[0] != covariance.shape[1]:\n        raise ValueError(\"covariance must be square.\")\n    if covariance.shape[0] == 0:\n        raise ValueError(\"covariance must not be empty.\")\n    if not np.all(np.isfinite(covariance)):\n        raise ValueError(\"covariance must be finite.\")\n\n    eigenvalues = np.linalg.eigvalsh(covariance)\n    spectral_scale = max(float(np.max(np.abs(eigenvalues))), 1.0)\n    tolerance = (\n        10.0\n        * np.finfo(float).eps\n        * max(covariance.shape[0], 1)\n        * spectral_scale\n    )\n    min_eigenvalue = float(eigenvalues[0])\n    if min_eigenvalue < -tolerance:\n        raise ValueError(\"covariance must be positive semidefinite.\")\n\n    diagonal = np.diag(covariance)\n    diagonal_scale = max(float(np.max(np.abs(diagonal))), 1.0)\n    mean_diagonal = diagonal_scale * float(np.mean(diagonal / diagonal_scale))\n    scale = max(mean_diagonal, 1.0)\n    diagonal_shift = float(jitter) * scale\n    shifted_min_eigenvalue = min_eigenvalue + diagonal_shift\n    if shifted_min_eigenvalue <= 0.0:\n        floor = 1e-10 * scale\n        diagonal_shift += max(floor, -shifted_min_eigenvalue + floor)\n    if diagonal_shift > 0.0:\n        covariance = covariance + diagonal_shift * np.eye(covariance.shape[0])\n    return _symmetrize_np(covariance)\n""",
          )

          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/filters/test_daum_huang_particle_flow_validation.py")
          test_path.write_text(
              '''import numpy as np\nimport pytest\n\nfrom pyrecest.backend import array, to_numpy\nfrom pyrecest.filters.daum_huang_particle_filter import (\n    gaussian_bridge_moments,\n    gaussian_particle_flow_update,\n)\nfrom pyrecest.models import LinearGaussianMeasurementModel\n\n\ndef test_gaussian_bridge_rejects_negative_definite_state_covariance():\n    with pytest.raises(ValueError, match="positive semidefinite"):\n        gaussian_bridge_moments(\n            array([0.0, 0.0]),\n            array([[-1.0, 0.0], [0.0, -2.0]]),\n            array([[1.0, 0.0]]),\n            array([0.0]),\n            array([[1.0]]),\n            1.0,\n        )\n\n\ndef test_gaussian_bridge_rejects_negative_definite_measurement_covariance():\n    with pytest.raises(ValueError, match="positive semidefinite"):\n        gaussian_bridge_moments(\n            array([0.0, 0.0]),\n            array([[1.0, 0.0], [0.0, 1.0]]),\n            array([[1.0, 0.0], [0.0, 1.0]]),\n            array([0.0, 0.0]),\n            array([[-1.0, 0.0], [0.0, -2.0]]),\n            1.0,\n        )\n\n\ndef test_gaussian_bridge_regularizes_singular_positive_semidefinite_covariance():\n    mean, covariance = gaussian_bridge_moments(\n        array([0.0, 0.0]),\n        array([[1.0, 0.0], [0.0, 0.0]]),\n        array([[1.0, 0.0]]),\n        array([0.0]),\n        array([[1.0]]),\n        1.0,\n        jitter=0.0,\n    )\n\n    assert np.all(np.isfinite(to_numpy(mean)))\n    assert np.all(np.linalg.eigvalsh(to_numpy(covariance)) > 0.0)\n\n\n@pytest.mark.parametrize(\n    ("kwargs", "message"),\n    (\n        ({"n_steps": np.ma.array(2, mask=True)}, "n_steps"),\n        ({"jitter": np.ma.array(1e-8, mask=True)}, "jitter"),\n        (\n            {"step_schedule": np.ma.array([0.5, 0.5], mask=[False, True])},\n            "step_schedule",\n        ),\n        ({"weights": np.ma.array([0.5, 0.5], mask=[False, True])}, "weights"),\n    ),\n)\ndef test_particle_flow_rejects_masked_controls(kwargs, message):\n    model = LinearGaussianMeasurementModel(array([[1.0]]), array([[1.0]]))\n    with pytest.raises(ValueError, match=message):\n        gaussian_particle_flow_update(\n            array([[-1.0], [1.0]]),\n            model,\n            array([0.0]),\n            **kwargs,\n        )\n\n\ndef test_particle_flow_rejects_masked_particles_and_measurements():\n    model = LinearGaussianMeasurementModel(array([[1.0]]), array([[1.0]]))\n\n    with pytest.raises(ValueError, match="particles"):\n        gaussian_particle_flow_update(\n            np.ma.array([[-1.0], [1.0]], mask=[[False], [True]]),\n            model,\n            array([0.0]),\n        )\n\n    with pytest.raises(ValueError, match="measurement"):\n        gaussian_particle_flow_update(\n            array([[-1.0], [1.0]]),\n            model,\n            np.ma.array([0.0], mask=[True]),\n        )\n''',
              encoding="utf-8",
          )

          Path(".github/workflows/agent-harden-particle-flow-validation.yml").unlink()
          PY

      - name: Validate focused tests
        shell: bash
        run: |
          python -m py_compile \
            src/pyrecest/filters/daum_huang_particle_filter.py \
            tests/filters/test_daum_huang_particle_flow_validation.py
          pytest -q \
            tests/filters/test_daum_huang_particle_flow.py \
            tests/filters/test_daum_huang_particle_flow_validation.py

      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Gaussian particle-flow validation"
          git push
